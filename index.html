<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AgroFlight Pro - Simulador Agrícola</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            position: fixed;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* ==================== HUD ==================== */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 9px;
            pointer-events: none;
            z-index: 10;
            min-width: 150px;
            backdrop-filter: blur(8px);
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
            font-size: 8px;
        }
        .hud-val {
            font-weight: bold;
            font-family: 'Courier New', monospace;
            font-size: 9px;
        }
        .hud-val.alt { color: #38bdf8; }
        .hud-val.spd { color: #facc15; }
        .hud-val.pwr { color: #f97316; }
        .hud-val.cov { color: #4ade80; }
        .hud-val.credits { color: #fbbf24; }
        .hud-val.status { color: #f472b6; }

        .tank-bar-outer {
            width: 100%;
            height: 5px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 3px;
        }
        .tank-bar-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #06b6d4);
            transition: width 0.2s;
        }

        /* ==================== ALERTAS ==================== */
        #alert-banner {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 15;
            text-align: center;
            backdrop-filter: blur(4px);
            min-width: 180px;
            max-width: 90%;
        }
        #alert-banner.spray { opacity: 1; background: rgba(16, 185, 129, 0.9); color: #064e3b; }
        #alert-banner.warn { opacity: 1; background: rgba(239, 68, 68, 0.9); color: #fff; animation: blink 0.5s infinite alternate; }
        #alert-banner.info { opacity: 1; background: rgba(59, 130, 246, 0.9); color: #fff; }
        #alert-banner.success { opacity: 1; background: rgba(16, 185, 129, 0.9); color: #064e3b; }

        @keyframes blink {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* ==================== PANEL DE PREPARACIÓN ==================== */
        #panel-preparacion {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.92);
            padding: 16px 20px;
            border-radius: 15px;
            z-index: 30;
            min-width: 340px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            max-height: 70vh;
            overflow-y: auto;
        }
        #panel-preparacion h3 {
            margin: 0 0 12px 0;
            text-align: center;
            color: #4ade80;
            font-size: 14px;
        }
        .quimico-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .quimico-btn {
            padding: 8px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 9px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .quimico-btn:hover { transform: scale(1.03); }
        .quimico-btn:active { transform: scale(0.95); }
        .quimico-btn.herbicida { background: #2e7d32; }
        .quimico-btn.fungicida { background: #b8860b; }
        .quimico-btn.insecticida { background: #8b0000; }
        .quimico-btn.fertilizante { background: #4a7c59; }
        .quimico-btn.regulador { background: #6b4c9a; }
        .quimico-btn.coadyuvante { background: #c0392b; }
        .quimico-btn.selected { box-shadow: 0 0 20px rgba(255,255,255,0.3); }

        .barra-progreso {
            width: 100%;
            height: 18px;
            background: #1e293b;
            border-radius: 9px;
            overflow: hidden;
            margin: 4px 0;
            position: relative;
        }
        .barra-progreso .fill {
            height: 100%;
            transition: width 0.3s;
            border-radius: 9px;
        }
        .barra-progreso .label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 9px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .prep-row {
            display: flex;
            gap: 8px;
            margin: 6px 0;
            flex-wrap: wrap;
        }
        .prep-row button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
            min-width: 60px;
        }
        .prep-row button:active { transform: scale(0.95); }
        .btn-quimico { background: #f97316; }
        .btn-agua { background: #3b82f6; }
        .btn-mezclar { background: #f59e0b; }
        .btn-cargar { background: #10b981; flex: 2; font-size: 12px; }
        .btn-cancelar { background: #ef4444; }

        .info-text {
            font-size: 10px;
            color: #94a3b8;
            text-align: center;
            margin: 4px 0;
        }
        .info-text strong { color: #fff; }

        /* ==================== PALANCA DE POTENCIA ==================== */
        #throttle-container {
            position: absolute;
            right: 15px;
            bottom: 180px;
            width: 45px;
            height: 140px;
            background: rgba(0,0,0,0.7);
            border-radius: 22px;
            z-index: 25;
            border: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            touch-action: none;
        }
        #throttle-track {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: calc(100% - 24px);
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        #throttle-handle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 30% 30%, #f97316, #ea580c);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 20px rgba(249,115,22,0.3);
            transition: bottom 0.05s;
            cursor: pointer;
            touch-action: none;
        }
        #throttle-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #throttle-icons {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
        }
        #throttle-icons.top { top: 4px; }
        #throttle-icons.bottom { bottom: 4px; }

        /* ==================== JOYSTICK ==================== */
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, rgba(0,0,0,0.5), rgba(0,0,0,0.8));
            border: 3px solid rgba(255,255,255,0.1);
            z-index: 20;
            backdrop-filter: blur(4px);
            touch-action: none;
        }
        #joystick-base {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(74,222,128,0.15), transparent);
            border: 2px solid rgba(255,255,255,0.05);
        }
        #joystick-thumb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #4ade80, #059669);
            box-shadow: 0 0 30px rgba(74,222,128,0.15);
            cursor: pointer;
            touch-action: none;
            transition: all 0.05s;
        }

        /* ==================== BOTONES DE CONTROL ==================== */
        #control-buttons {
            position: absolute;
            bottom: 160px;
            right: 75px;
            display: flex;
            gap: 6px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 10px;
            font-size: 8px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ctrl-btn:active { transform: scale(0.92); }
        .ctrl-btn.spray { background: rgba(16, 185, 129, 0.7); border: 1px solid rgba(16, 185, 129, 0.4); }
        .ctrl-btn.flaps { background: rgba(59, 130, 246, 0.7); border: 1px solid rgba(59, 130, 246, 0.4); }
        .ctrl-btn.brake { background: rgba(239, 68, 68, 0.7); border: 1px solid rgba(239, 68, 68, 0.4); }
        .ctrl-btn.rescue { background: rgba(251, 191, 36, 0.7); border: 1px solid rgba(251, 191, 36, 0.4); }
        .ctrl-btn.engine { background: rgba(74, 222, 128, 0.7); border: 1px solid rgba(74, 222, 128, 0.4); }
        .ctrl-btn.active { background: rgba(16, 185, 129, 0.9); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }

        /* ==================== PANEL SUPERIOR ==================== */
        #control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 180px;
        }
        .panel-btn {
            padding: 5px 10px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 8px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .panel-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }
        .panel-btn.shop { border-color: rgba(251, 191, 36, 0.3); color: #fbbf24; }
        .panel-btn.mission { border-color: rgba(16, 185, 129, 0.3); color: #4ade80; }
        .panel-btn.save { border-color: rgba(59, 130, 246, 0.3); color: #38bdf8; }

        /* ==================== MENÚ DE PAUSA ==================== */
        #pause-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        #pause-menu .menu-box {
            background: rgba(15, 23, 42, 0.95);
            padding: 25px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 350px;
            width: 90%;
            text-align: center;
        }
        #pause-menu h2 { color: #4ade80; margin-bottom: 15px; font-size: 18px; }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-btn:hover { background: rgba(255,255,255,0.1); }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn.primary { background: rgba(16, 185, 129, 0.3); border-color: rgba(16, 185, 129, 0.3); }
        .menu-btn.danger { background: rgba(239, 68, 68, 0.3); border-color: rgba(239, 68, 68, 0.3); }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 600px) {
            #hud { font-size: 7px; padding: 5px 8px; min-width: 110px; }
            .hud-row { font-size: 7px; }
            .hud-val { font-size: 8px; }
            #panel-preparacion { min-width: 90%; padding: 12px 15px; bottom: 160px; }
            #panel-preparacion h3 { font-size: 12px; }
            .quimico-grid { grid-template-columns: repeat(3, 1fr); gap: 4px; }
            .quimico-btn { font-size: 7px; padding: 6px; }
            #throttle-container { width: 38px; height: 110px; right: 8px; bottom: 160px; }
            #throttle-handle { width: 28px; height: 28px; }
            #throttle-label { font-size: 7px; }
            #joystick-container { width: 100px; height: 100px; bottom: 20px; }
            #joystick-thumb { width: 38px; height: 38px; }
            #control-buttons { bottom: 140px; right: 55px; gap: 4px; }
            .ctrl-btn { padding: 4px 8px; font-size: 7px; }
            #control-panel { top: 5px; right: 5px; gap: 3px; max-width: 130px; }
            .panel-btn { padding: 4px 7px; font-size: 7px; }
            .prep-row button { padding: 6px; font-size: 8px; }
            .btn-cargar { font-size: 10px; }
            #alert-banner { font-size: 9px; padding: 5px 12px; min-width: 140px; top: 45px; }
            #pause-menu .menu-box { padding: 18px 20px; }
            #pause-menu h2 { font-size: 16px; }
            .menu-btn { padding: 8px; font-size: 11px; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            #panel-preparacion { bottom: 140px; min-width: 70%; padding: 10px 14px; }
            #panel-preparacion h3 { font-size: 11px; margin-bottom: 8px; }
            .quimico-grid { grid-template-columns: repeat(4, 1fr); gap: 3px; }
            .quimico-btn { font-size: 7px; padding: 4px; }
            #throttle-container { height: 90px; width: 35px; bottom: 130px; right: 5px; }
            #throttle-handle { width: 24px; height: 24px; }
            #joystick-container { width: 80px; height: 80px; bottom: 15px; }
            #joystick-thumb { width: 32px; height: 32px; }
            #control-buttons { bottom: 120px; right: 45px; }
            .ctrl-btn { padding: 3px 6px; font-size: 6px; }
            .prep-row button { padding: 4px; font-size: 7px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- ==================== HUD ==================== -->
    <div id="hud">
        <div class="hud-row"><span>ALTITUD:</span> <span class="hud-val alt" id="val-alt">0m</span></div>
        <div class="hud-row"><span>VELOCIDAD:</span> <span class="hud-val spd" id="val-spd">0 km/h</span></div>
        <div class="hud-row"><span>POTENCIA:</span> <span class="hud-val pwr" id="val-pwr">0%</span></div>
        <div class="hud-row"><span>MARCADO:</span> <span class="hud-val cov" id="val-cov">0 ha</span></div>
        <div class="hud-row"><span>💰 CRÉDITOS:</span> <span class="hud-val credits" id="val-credits">$500</span></div>
        <div class="hud-row"><span>🔄 ESTADO:</span> <span class="hud-val status" id="val-status">EN TIERRA</span></div>
        <div class="tank-bar-outer"><div class="tank-bar-inner" id="bar-tank"></div></div>
    </div>

    <!-- ==================== ALERTAS ==================== -->
    <div id="alert-banner">BIENVENIDO PILOTO</div>

    <!-- ==================== PANEL DE PREPARACIÓN ==================== -->
    <div id="panel-preparacion">
        <h3>🚜 PREPARACIÓN DEL AVION</h3>
        
        <div class="quimico-grid">
            <button class="quimico-btn herbicida" onclick="seleccionarQuimico('herbicida')">🌿 Herbicida</button>
            <button class="quimico-btn fungicida" onclick="seleccionarQuimico('fungicida')">🍄 Fungicida</button>
            <button class="quimico-btn insecticida" onclick="seleccionarQuimico('insecticida')">🐛 Insecticida</button>
            <button class="quimico-btn fertilizante" onclick="seleccionarQuimico('fertilizante')">🌱 Fertilizante</button>
            <button class="quimico-btn regulador" onclick="seleccionarQuimico('regulador')">📈 Regulador</button>
            <button class="quimico-btn coadyuvante" onclick="seleccionarQuimico('coadyuvante')">💧 Coadyuvante</button>
        </div>
        
        <div class="info-text">Químico: <strong id="quimico-nombre">Ninguno</strong> | Dosis: <strong id="quimico-dosis">0 L/ha</strong></div>
        
        <div>
            <div style="display:flex; justify-content:space-between; font-size:9px;">
                <span>🧪 Químico</span>
                <span id="nivel-quimico-text">0%</span>
            </div>
            <div class="barra-progreso">
                <div class="fill" id="barra-quimico" style="width:0%; background:linear-gradient(90deg, #f97316, #ef4444);"></div>
                <span class="label" id="barra-quimico-label">0%</span>
            </div>
        </div>
        
        <div>
            <div style="display:flex; justify-content:space-between; font-size:9px;">
                <span>💧 Agua</span>
                <span id="nivel-agua-text">0%</span>
            </div>
            <div class="barra-progreso">
                <div class="fill" id="barra-agua" style="width:0%; background:linear-gradient(90deg, #38bdf8, #3b82f6);"></div>
                <span class="label" id="barra-agua-label">0%</span>
            </div>
        </div>
        
        <div>
            <div style="display:flex; justify-content:space-between; font-size:9px;">
                <span>🔄 Mezcla</span>
                <span id="mezcla-porcentaje">0%</span>
            </div>
            <div class="barra-progreso">
                <div class="fill" id="barra-mezcla" style="width:0%; background:linear-gradient(90deg, #4ade80, #22d3ee);"></div>
                <span class="label" id="barra-mezcla-label">0%</span>
            </div>
        </div>
        
        <div class="prep-row">
            <button class="btn-quimico" onclick="agregarQuimico()">+ Químico</button>
            <button class="btn-agua" onclick="agregarAgua()">💧 Agua</button>
            <button class="btn-mezclar" onclick="iniciarMezcla()">🔄 Mezclar</button>
        </div>
        
        <div class="prep-row">
            <button class="btn-cargar" onclick="cargarAvion()">✅ CARGAR AVION</button>
            <button class="btn-cancelar" onclick="cancelarPreparacion()">❌</button>
        </div>
    </div>

    <!-- ==================== PALANCA DE POTENCIA ==================== -->
    <div id="throttle-container">
        <div id="throttle-icons" class="top">▲</div>
        <div id="throttle-track">
            <div id="throttle-handle">
                <div id="throttle-label">0%</div>
            </div>
        </div>
        <div id="throttle-icons" class="bottom">▼</div>
    </div>

    <!-- ==================== JOYSTICK ==================== -->
    <div id="joystick-container">
        <div id="joystick-base">
            <div id="joystick-thumb"></div>
        </div>
    </div>

    <!-- ==================== BOTONES DE CONTROL ==================== -->
    <div id="control-buttons">
        <button class="ctrl-btn engine" id="btn-engine">🔌 MOTOR</button>
        <button class="ctrl-btn spray" id="btn-spray">💨 SPRAY</button>
        <button class="ctrl-btn flaps" id="btn-flaps">🔄 FLAPS</button>
        <button class="ctrl-btn brake" id="btn-brake">🛑 FRENO</button>
        <button class="ctrl-btn rescue" id="btn-rescue">🚁 RESCATE</button>
    </div>

    <!-- ==================== PANEL SUPERIOR ==================== -->
    <div id="control-panel">
        <button class="panel-btn shop" id="btn-shop">🏪 TIENDA</button>
        <button class="panel-btn mission" id="btn-mission">📋 MISIÓN</button>
        <button class="panel-btn save" id="btn-save">💾 GUARDAR</button>
        <button class="panel-btn" id="btn-pause">⏸️ PAUSA</button>
        <button class="panel-btn" id="btn-cam">📷 CAM</button>
    </div>

    <!-- ==================== MENÚ DE PAUSA ==================== -->
    <div id="pause-menu">
        <div class="menu-box">
            <h2>⏸️ PAUSA</h2>
            <button class="menu-btn primary" id="btn-resume">▶️ CONTINUAR</button>
            <button class="menu-btn" id="btn-save-menu">💾 GUARDAR PARTIDA</button>
            <button class="menu-btn" id="btn-load-menu">📂 CARGAR PARTIDA</button>
            <button class="menu-btn" id="btn-restart">🔄 REINICIAR</button>
            <button class="menu-btn danger" id="btn-quit">🚪 SALIR</button>
        </div>
    </div>

    <!-- ==================== SCRIPT ==================== -->
    <script>
        // ================================================================
        // 1. CONFIGURACIÓN Y ESTADO
        // ================================================================
        const CONFIG = {
            gravedad: 9.8,
            maxPotencia: 100,
            stallSpeed: 40,
            maxAltitud: 150,
            anchoAspersionBase: 13.5,
        };

        const estado = {
            creditos: 500,
            mejoras: { motor: 0, tanque: 0, presion: 0, boquilla: 0 },
            misiones: [],
            misionActual: null,
            areaMision: 0,
            horasVuelo: 0,
            hectareas: 0,
            motorEncendido: false,
        };

        // Químicos disponibles
        const quimicos = {
            herbicida: { nombre: 'Herbicida', color: 0x22c55e, dosis: 2.5 },

            regulador: { nombre: 'Regulador', color: 0x8b5cf6, dosis: 1.2 },

            const mark = new THREE.Mesh(

        // Parcelas

        for (let x = -800; x <= 800; x += 350) {

                if (Math.abs(x) < 200 && Math.abs(z) < 300) continue;
                const campo = new THREE.Mesh(

                );

                campo.receiveShadow = true;
                scene.add(campo);
            }

        // ================================================================
        // 4. OBSTÁCULOS
        // ================================================================
        const obstacles = [];
        const poleMat = new THREE.MeshLambertMaterial({ color: 0x64748b });
        const wireMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
        const treeTrunkMat = new THREE.MeshLambertMaterial({ color: 0x5c3d11 });
        const treeLeavesMat = new THREE.MeshLambertMaterial({ color: 0x1b4332 });

        function createPowerLines(startZ, endZ, posX) {
            let prev = null;
            for (let z = startZ; z <= endZ; z += 120) {
                const group = new THREE.Group();
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 18), poleMat);
                pole.position.y = 9;
                pole.castShadow = true;
                group.add(pole);
                const cross = new THREE.Mesh(new THREE.BoxGeometry(6, 0.3, 0.3), poleMat);
                cross.position.y = 17;
                cross.castShadow = true;
                group.add(cross);
                group.position.set(posX, 0, z);
                scene.add(group);
                obstacles.push({ x: posX, y: 9, z, radius: 3, height: 18 });
                if (prev) {
                    const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 120), wireMat);
                    wire.position.set(posX, 17, z - 60);
                    wire.rotation.x = Math.PI / 2;
                    scene.add(wire);
                }
                prev = { x: posX, y: 17, z };
            }
        }
        createPowerLines(-600, 600, 160);

            tree.add(leaves);
            tree.position.set(tx, 0, tz);
            scene.add(tree);

        cabin.position.set(0, 2.5, 0.3);

        airplane.add(cabin);

        wing.position.set(0, 1.3, -0.8);
        wing.castShadow = true;
        airplane.add(wing);

            const blade = new THREE.Mesh(

                new THREE.MeshLambertMaterial({ color: 0x1e293b })

            blade.position.y = (i === 0) ? 1.4 : -1.4;
            propGroup.add(blade);
        }
        propGroup.position.set(0, 1.2, -5.5);
        airplane.add(propGroup);

        // Tren de aterrizaje
        const gearMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
        for (let side = -1; side <= 1; side += 2) {
            const gearLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.6), gearMat);
            gearLeg.position.set(side * 1.2, 0.1, 0.5);
            airplane.add(gearLeg);
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.08), darkMat);

        // ================================================================
        const sprayedTracks = [];

        function paintSwath() {
            if (altitude > 10) return;
            const ancho = CONFIG.anchoAspersionBase + (estado.mejoras.boquilla * 1.5);
            const track = new THREE.Mesh(new THREE.PlaneGeometry(ancho, 3), trackMat);
            track.rotation.x = -Math.PI / 2;
            track.rotation.z = airplane.rotation.y;
            track.position.set(airplane.position.x, 0.2, airplane.position.z);
            scene.add(track);
            sprayedTracks.push(track);
            areaCoveredSqm += ancho * 3;
            estado.areaMision += ancho * 3;
            estado.hectareas += (ancho * 3) / 10000;
        }

        // Partículas
        const particleCount = 300;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 2.0,
            transparent: true,
            opacity: 0.6,
            color: 0x00ffff,
            blending: THREE.NormalBlending,
            depthWrite: false
        });
        const sprayParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(sprayParticles);
        let particleIdx = 0;

        function emitSpray() {
            if (!isSpraying || tankLevel <= 0 || avionEstado !== 'volando') return;
            const pos = sprayParticles.geometry.attributes.position.array;
            const ancho = CONFIG.anchoAspersionBase + (estado.mejoras.boquilla * 1.5);
            for (let i = -ancho / 2; i <= ancho / 2; i += 1.5) {
                const pt = new THREE.Vector3(i, 0.8, -0.1).applyMatrix4(airplane.matrixWorld);
                pos[particleIdx * 3] = pt.x + (Math.random() - 0.5) * 0.5;
                pos[particleIdx * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.5;
                pos[particleIdx * 3 + 2] = pt.z + (Math.random() - 0.5) * 0.5;
                particleIdx = (particleIdx + 1) % particleCount;
            }
            sprayParticles.geometry.attributes.position.needsUpdate = true;
            paintSwath();
        }

        // ================================================================
        // 7. FUNCIONES DE PREPARACIÓN
        // ================================================================
        function seleccionarQuimico(tipo) {
            if (avionEstado === 'volando') {
                mostrarAlerta('⚠️ No puedes cambiar en vuelo', 'warn');
                return;
            }
            quimicoSeleccionado = quimicos[tipo];
            document.getElementById('quimico-nombre').textContent = quimicoSeleccionado.nombre;
            document.getElementById('quimico-dosis').textContent = quimicoSeleccionado.dosis + ' L/ha';
            // Resaltar botón
            document.querySelectorAll('.quimico-btn').forEach(b => b.classList.remove('selected'));
            document.querySelector(`.quimico-btn.${tipo}`).classList.add('selected');
            mostrarAlerta(`✅ Seleccionado: ${quimicoSeleccionado.nombre}`, 'info');
        }

        function agregarQuimico() {
            if (!quimicoSeleccionado || avionEstado === 'volando') {
                mostrarAlerta('⚠️ Selecciona un químico', 'warn');
                return;
            }
            if (nivelQuimico < 100) {
                nivelQuimico = Math.min(100, nivelQuimico + 10);
                actualizarBarras();
            }
        }

        function agregarAgua() {
            if (nivelQuimico === 0 || avionEstado === 'volando') {
                mostrarAlerta('⚠️ Agrega químico primero', 'warn');
                return;
            }
            if (nivelAgua < 100) {
                nivelAgua = Math.min(100, nivelAgua + 10);
                actualizarBarras();
            }
        }

        function iniciarMezcla() {
            if (nivelQuimico === 0 || nivelAgua === 0) {
                mostrarAlerta('⚠️ Necesitas químico y agua', 'warn');
                return;
            }
            if (avionEstado === 'volando') {
                mostrarAlerta('⚠️ No puedes mezclar en vuelo', 'warn');
                return;
            }
            
            let progreso = 0;
            const intervalo = setInterval(() => {
                progreso += 2;
                calidadMezcla = Math.min(100, progreso);
                document.getElementById('barra-mezcla').style.width = calidadMezcla + '%';
                document.getElementById('barra-mezcla-label').textContent = calidadMezcla + '%';
                document.getElementById('mezcla-porcentaje').textContent = calidadMezcla + '%';
                
                if (calidadMezcla >= 100) {
                    clearInterval(intervalo);
                    mostrarAlerta('✅ MEZCLA COMPLETA', 'success');
                }
            }, 100);
        }

        function actualizarBarras() {
            document.getElementById('barra-quimico').style.width = nivelQuimico + '%';
            document.getElementById('barra-quimico-label').textContent = nivelQuimico + '%';
            document.getElementById('nivel-quimico-text').textContent = nivelQuimico + '%';
            
            document.getElementById('barra-agua').style.width = nivelAgua + '%';
            document.getElementById('barra-agua-label').textContent = nivelAgua + '%';
            document.getElementById('nivel-agua-text').textContent = nivelAgua + '%';
        }

        function cargarAvion() {
            if (calidadMezcla < 100 || nivelQuimico === 0 || nivelAgua === 0) {
                mostrarAlerta('⚠️ Mezcla incompleta', 'warn');
                return;
            }
            
            const capacidadBase = 100 + (estado.mejoras.tanque * 20);

            document.getElementById('bar-tank').style.width = '100%';
            
            document.getElementById('panel-preparacion').style.display = 'none';

        function cancelarPreparacion() {

            nivelQuimico = 0;
            nivelAgua = 0;
            calidadMezcla = 0;
            quimicoSeleccionado = null;
            actualizarBarras();
            document.getElementById('barra-mezcla').style.width = '0%';
            document.getElementById('barra-mezcla-label').textContent = '0%';
            document.getElementById('mezcla-porcentaje').textContent = '0%';
            document.getElementById('quimico-nombre').textContent = 'Ninguno';

        // ================================================================
        // 8. FUNCIONES DE CONTROL DE VUELO
        // ================================================================
        function toggleEngine() {
            if (avionEstado === 'tierra' && tankLevel > 0 && calidadMezcla >= 100) {
                estado.motorEncendido = !estado.motorEncendido;
                if (estado.motorEncendido) {
                    avionEstado = 'volando';
                    document.getElementById('btn-engine').classList.add('active');
                    document.getElementById('btn-engine').textContent = '🔌 ON';
                    document.getElementById('val-status').textContent = 'VOLANDO';
                    document.getElementById('panel-preparacion').style.display = 'none';
                    mostrarAlerta('🛫 MOTOR ENCENDIDO - ¡A VOLAR!', 'success');
                    throttleTarget = 20;
                } else {
                    document.getElementById('btn-engine').classList.remove('active');
                    document.getElementById('btn-engine').textContent = '🔌 MOTOR';
                    document.getElementById('val-status').textContent = 'APAGADO';
                    mostrarAlerta('⏹️ MOTOR APAGADO', 'info');
                }
            } else if (avionEstado === 'volando') {
                estado.motorEncendido = false;
                avionEstado = 'tierra';
                document.getElementById('btn-engine').classList.remove('active');
                document.getElementById('btn-engine').textContent = '🔌 MOTOR';
                document.getElementById('val-status').textContent = 'EN TIERRA';
                throttleTarget = 0;
                throttle = 0;
                mostrarAlerta('⏹️ MOTOR APAGADO', 'info');
            } else {
                mostrarAlerta('⚠️ Carga el avión primero', 'warn');
            }
        }

        function toggleSpray() {
            if (avionEstado !== 'volando') {
                mostrarAlerta('⚠️ Debes estar en vuelo', 'warn');
                return;
            }
            if (tankLevel <= 0) {
                mostrarAlerta('⚠️ Tanque vacío', 'warn');
                return;
            }
            isSpraying = !isSpraying;
            document.getElementById('btn-spray').classList.toggle('active');
            mostrarAlerta(isSpraying ? '💨 ASPERSIÓN ACTIVA' : '⏸️ ASPERSIÓN PAUSADA', isSpraying ? 'spray' : 'info');
        }

        function toggleFlaps() {
            flaps = (flaps + 1) % 4;
            mostrarAlerta(`🔄 FLAPS ${flaps * 10}°`, 'info');
        }

        function toggleBrake() {
            brake = !brake;
            document.getElementById('btn-brake').classList.toggle('active');
            mostrarAlerta(brake ? '🛑 FRENOS' : 'FRENOS OFF', brake ? 'warn' : 'info');
        }

        function rescuePlane() {
            if (avionEstado === 'tierra') {
                mostrarAlerta('⚠️ Ya estás en tierra', 'warn');
                return;
            }
            const costo = 100 + Math.abs(airplane.position.x) / 10;
            if (estado.creditos < costo) {
                mostrarAlerta(`💰 Créditos insuficientes ($${costo})`, 'warn');
                return;
            }
            estado.creditos -= costo;
            mostrarAlerta(`🚁 RESCATANDO... -$${costo}`, 'info');
            setTimeout(() => {
                airplane.position.set(0, 1, 80);
                altitude = 1;
                speed = 0;
                throttle = 0;
                throttleTarget = 0;
                pitch = 0;
                roll = 0;
                yaw = 0;
                avionEstado = 'tierra';
                estado.motorEncendido = false;
                tankLevel = 0;
                isSpraying = false;
                document.getElementById('btn-spray').classList.remove('active');
                document.getElementById('btn-engine').classList.remove('active');
                document.getElementById('btn-engine').textContent = '🔌 MOTOR';
                document.getElementById('bar-tank').style.width = '0%';
                document.getElementById('throttle-handle').style.bottom = '0%';
                document.getElementById('throttle-label').textContent = '0%';
                document.getElementById('val-status').textContent = 'EN TIERRA';
                mostrarAlerta('🛬 AVION RESCATADO', 'success');
                document.getElementById('panel-preparacion').style.display = 'block';
            }, 2000);
        }

        // ================================================================
        // 9. FÍSICA
        // ================================================================
        function updatePhysics(delta) {
            if (avionEstado !== 'volando') return;

            // Potencia
            if (throttle < throttleTarget) {
                throttle = Math.min(throttleTarget, throttle + 60 * delta);
            } else if (throttle > throttleTarget) {
                throttle = Math.max(throttleTarget, throttle - 60 * delta);
            }

            // Velocidad
            const motorBonus = 1 + (estado.mejoras.motor * 0.15);
            const drag = 0.02 + (pitch * 0.01);
            const thrust = (throttle / 100) * 130 * motorBonus;
            speed += (thrust - speed * speed * drag - 0.3) * delta;
            speed = Math.max(0, speed);

            // Controles (joystick)
            const ctrlSens = Math.min(1, speed / 25);
            pitch += (joyY * 1.2 - pitch * 0.3) * delta * 4 * ctrlSens;
            pitch = Math.max(-0.6, Math.min(0.6, pitch));

            roll += (joyX * 1.5 - roll * 0.3) * delta * 4 * ctrlSens;
            roll = Math.max(-0.8, Math.min(0.8, roll));

            // Rotaciones
            airplane.rotation.x = pitch * 0.6;
            airplane.rotation.z = -roll * 0.7;
            yaw += (-roll * 1.0) * delta * ctrlSens;
            airplane.rotation.y = yaw;

            // Movimiento
            const speedFactor = speed / 3.6 * (brake ? 0.3 : 1);
            airplane.translateOnAxis(new THREE.Vector3(0, 0, -1), speedFactor * delta);

            // Gravedad y sustentación
            const lift = speed * 0.03 * (1 + pitch * 0.5) * (1 - flaps * 0.03);
            const weight = 0.5 + (tankLevel / 100) * 0.3;
            const gravity = 2.5 * weight * delta;
            altitude += (lift - gravity) * delta;
            altitude = Math.max(0.2, Math.min(CONFIG.maxAltitud, altitude));
            airplane.position.y = altitude;

            // Stall
            if (speed < CONFIG.stallSpeed && altitude > 2) {
                airplane.rotation.z += (Math.random() - 0.5) * 0.01;
                if (Math.random() < 0.005) {
                    mostrarAlerta('🚨 ¡PÉRDIDA!', 'warn');
                }
            }

            // Aspersión
            if (isSpraying && tankLevel > 0) {
                const consumo = 3.5 + (estado.mejoras.presion * 0.3);
                tankLevel = Math.max(0, tankLevel - consumo * delta);
                emitSpray();
                document.getElementById('bar-tank').style.width = (tankLevel / 100 * 100) + '%';
                if (tankLevel <= 0) {
                    isSpraying = false;
                    document.getElementById('btn-spray').classList.remove('active');
                    mostrarAlerta('⛽ TANQUE VACÍO', 'warn');
                }
            }

            // Colisiones
            const pos = airplane.position;
            for (let obs of obstacles) {
                const dist = Math.sqrt(Math.pow(pos.x - obs.x, 2) + Math.pow(pos.z - obs.z, 2));
                if (dist < obs.radius + 2 && altitude < obs.height) {
                    mostrarAlerta('🚨 ¡OBSTÁCULO!', 'warn');
                    speed *= 0.5;
                    throttle = Math.max(0, throttle - 20);
                    break;
                }
            }

            // Aterrizaje
            if (altitude < 0.5 && Math.abs(pos.z) < 50 && speed < 30) {
                aterrizar();
            }

            // HUD
            document.getElementById('val-alt').textContent = Math.round(altitude) + 'm';
            document.getElementById('val-spd').textContent = Math.round(speed) + ' km/h';
            document.getElementById('val-pwr').textContent = Math.round(throttle) + '%';
            document.getElementById('val-cov').textContent = (areaCoveredSqm / 10000).toFixed(2) + ' ha';
            document.getElementById('val-credits').textContent = '$' + estado.creditos;
        }

        function aterrizar() {
            avionEstado = 'tierra';
            estado.motorEncendido = false;
            isSpraying = false;
            document.getElementById('btn-spray').classList.remove('active');
            document.getElementById('btn-engine').classList.remove('active');
            document.getElementById('btn-engine').textContent = '🔌 MOTOR';
            document.getElementById('val-status').textContent = 'EN TIERRA';
            throttle = 0;
            throttleTarget = 0;
            document.getElementById('throttle-handle').style.bottom = '0%';
            document.getElementById('throttle-label').textContent = '0%';
            mostrarAlerta('🛬 ATERRIZAJE EXITOSO', 'success');
            setTimeout(() => {
                document.getElementById('panel-preparacion').style.display = 'block';
                mostrarAlerta('🔄 RECARGA PARA CONTINUAR', 'info');
            }, 1500);
        }

        // ================================================================
        // 10. GUARDADO
        // ================================================================
        function guardarPartida() {
            const data = {
                creditos: estado.creditos,
                mejoras: estado.mejoras,
                hectareas: estado.hectareas,
                areaCoveredSqm: areaCoveredSqm,
                timestamp: Date.now()
            };
            localStorage.setItem('agroflight_save', JSON.stringify(data));
            mostrarAlerta('💾 PARTIDA GUARDADA', 'success');
        }

        function cargarPartida() {
            const raw = localStorage.getItem('agroflight_save');
            if (!raw) {
                mostrarAlerta('📂 No hay partida guardada', 'info');
                return;
            }
            try {
                const data = JSON.parse(raw);
                estado.creditos = data.creditos || 500;
                estado.mejoras = data.mejoras || { motor: 0, tanque: 0, presion: 0, boquilla: 0 };
                estado.hectareas = data.hectareas || 0;
                areaCoveredSqm = data.areaCoveredSqm || 0;
                mostrarAlerta('📂 PARTIDA CARGADA', 'success');
                document.getElementById('val-credits').textContent = '$' + estado.creditos;
                document.getElementById('val-cov').textContent = (areaCoveredSqm / 10000).toFixed(2) + ' ha';
            } catch (e) {
                mostrarAlerta('⚠️ Error al cargar', 'warn');
            }
        }

        // ================================================================
        // 11. UI
        // ================================================================
        function mostrarAlerta(msg, tipo = 'info') {
            const banner = document.getElementById('alert-banner');
            banner.textContent = msg;
            banner.className = tipo;
            clearTimeout(banner._timeout);
            banner._timeout = setTimeout(() => { banner.className = ''; }, 3000);
        }

        function togglePause() {
            const menu = document.getElementById('pause-menu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        // ================================================================
        // 12. JOYSTICK
        // ================================================================
        const joystickContainer = document.getElementById('joystick-container');
        const joystickThumb = document.getElementById('joystick-thumb');

        function initJoystick() {
            const start = (e) => {
                e.preventDefault();
                joystickDrag = true;
                updateJoystick(e);
            };
            const move = (e) => {
                e.preventDefault();
                if (joystickDrag) updateJoystick(e);
            };
            const end = (e) => {
                e.preventDefault();
                joystickDrag = false;
                joyX = 0;
                joyY = 0;
                joystickThumb.style.transform = 'translate(-50%, -50%)';
            };

            joystickContainer.addEventListener('touchstart', start, { passive: false });
            joystickContainer.addEventListener('touchmove', move, { passive: false });
            joystickContainer.addEventListener('touchend', end, { passive: false });
            joystickContainer.addEventListener('touchcancel', end, { passive: false });
            joystickContainer.addEventListener('mousedown', start);
            document.addEventListener('mousemove', (e) => { if (joystickDrag) updateJoystick(e); });
            document.addEventListener('mouseup', end);
        }

        function updateJoystick(e) {
            const rect = joystickContainer.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const maxDist = rect.width / 2 - 20;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let dx = (clientX - cx) / maxDist;
            let dy = (clientY - cy) / maxDist;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 1) {
                dx /= dist;
                dy /= dist;
            }

            joyX = Math.max(-1, Math.min(1, dx));
            joyY = Math.max(-1, Math.min(1, -dy));

            const thumbX = joyX * maxDist;
            const thumbY = joyY * -maxDist;
            joystickThumb.style.transform = `translate(calc(-50% + ${thumbX}px), calc(-50% + ${thumbY}px))`;
        }

        initJoystick();

        // ================================================================
        // 13. PALANCA DE POTENCIA
        // ================================================================
        const throttleHandle = document.getElementById('throttle-handle');
        let throttleDrag = false;

        function updateThrottle(e) {
            const trackRect = document.getElementById('throttle-track').getBoundingClientRect();
            let clientY;
            if (e.touches) {
                clientY = e.touches[0].clientY;
            } else {
                clientY = e.clientY;
            }
            const y = clientY - trackRect.top;
            const percent = 1 - Math.max(0, Math.min(1, y / trackRect.height));
            const value = Math.round(percent * 100);
            throttleHandle.style.bottom = percent * 100 + '%';
            document.getElementById('throttle-label').textContent = value + '%';
            if (avionEstado === 'volando') {
                throttleTarget = value;
            }
        }

        throttleHandle.addEventListener('touchstart', (e) => {
            e.preventDefault();
            throttleDrag = true;
            updateThrottle(e);
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (throttleDrag) {
                e.preventDefault();
                updateThrottle(e);
            }
        }, { passive: false });

        document.addEventListener('touchend', () => { throttleDrag = false; });

        throttleHandle.addEventListener('mousedown', (e) => {
            throttleDrag = true;
            updateThrottle(e);
        });

        document.addEventListener('mousemove', (e) => {
            if (throttleDrag) updateThrottle(e);
        });

        document.addEventListener('mouseup', () => { throttleDrag = false; });

        // ================================================================
        // 14. EVENTOS DE BOTONES
        // ================================================================
        document.getElementById('btn-engine').addEventListener('click', toggleEngine);
        document.getElementById('btn-spray').addEventListener('click', toggleSpray);
        document.getElementById('btn-flaps').addEventListener('click', toggleFlaps);
        document.getElementById('btn-brake').addEventListener('click', toggleBrake);
        document.getElementById('btn-rescue').addEventListener('click', rescuePlane);
        document.getElementById('btn-save').addEventListener('click', guardarPartida);
        document.getElementById('btn-pause').addEventListener('click', togglePause);
        document.getElementById('btn-resume').addEventListener('click', togglePause);
        document.getElementById('btn-save-menu').addEventListener('click', () => { guardarPartida(); togglePause(); });
        document.getElementById('btn-load-menu').addEventListener('click', () => { cargarPartida(); togglePause(); });
        document.getElementById('btn-restart').addEventListener('click', () => {
            if (confirm('¿Reiniciar?')) {
                localStorage.removeItem('agroflight_save');
                location.reload();
            }
        });
        document.getElementById('btn-quit').addEventListener('click', () => {
            if (confirm('¿Salir?')) {
                guardarPartida();
                togglePause();
                mostrarAlerta('👋 ¡Hasta luego!', 'info');
            }
        });
        document.getElementById('btn-cam').addEventListener('click', () => {
            cameraMode = (cameraMode + 1) % 3;
            const modos = ['EXTERNA', 'CABINA', 'PANORÁMICA'];
            mostrarAlerta(`📷 ${modos[cameraMode]}`, 'info');
        });
        document.getElementById('btn-shop').addEventListener('click', () => {
            mostrarAlerta('🏪 TIENDA (Próximamente)', 'info');
        });
        document.getElementById('btn-mission').addEventListener('click', () => {
            mostrarAlerta('📋 MISIÓN: Fumigar 10 hectáreas', 'info');
        });

        // ================================================================
        // 15. TECLADO
        // ================================================================
        document.addEventListener('keydown', (e) => {
            switch (e.key.toLowerCase()) {
                case 'w': throttleTarget = Math.min(100, throttleTarget + 10); e.preventDefault(); break;
                case 's': throttleTarget = Math.max(0, throttleTarget - 10); e.preventDefault(); break;
                case 'arrowup': joyY = 1; e.preventDefault(); break;
                case 'arrowdown': joyY = -1; e.preventDefault(); break;
                case 'arrowleft': joyX = -1; e.preventDefault(); break;
                case 'arrowright': joyX = 1; e.preventDefault(); break;
                case ' ': toggleSpray(); e.preventDefault(); break;
                case 'q': toggleFlaps(); e.preventDefault(); break;
                case 'f': toggleBrake(); e.preventDefault(); break;
                case 'c': document.getElementById('btn-cam').click(); e.preventDefault(); break;
                case 'r': rescuePlane(); e.preventDefault(); break;
                case 'e': toggleEngine(); e.preventDefault(); break;
                case 'escape': togglePause(); e.preventDefault(); break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.key.toLowerCase()) {
                case 'arrowup':
                case 'arrowdown': joyY = 0; break;
                case 'arrowleft':
                case 'arrowright': joyX = 0; break;
            }
        });

        // ================================================================
        // 16. CÁMARA
        // ================================================================
        function updateCamera() {
            const pos = airplane.position;
            switch (cameraMode) {
                case 0:
                    const off = new THREE.Vector3(0, 8, 25).applyQuaternion(airplane.quaternion);
                    camera.position.copy(pos).add(off);
                    camera.lookAt(pos.clone().add(new THREE.Vector3(0, 2, -15).applyQuaternion(airplane.quaternion)));
                    break;
                case 1:
                    const cp = pos.clone().add(new THREE.Vector3(0, 2.8, 0.5).applyQuaternion(airplane.quaternion));
                    camera.position.copy(cp);
                    camera.lookAt(pos.clone().add(new THREE.Vector3(0, 2.5, -30).applyQuaternion(airplane.quaternion)));
                    break;
                case 2:
                    const dist = 40 + speed * 0.1;
                    const angle = Date.now() * 0.0001;
                    camera.position.set(
                        pos.x + Math.sin(angle) * dist,
                        pos.y + 15 + Math.sin(angle * 0.5) * 5,
                        pos.z + Math.cos(angle) * dist
                    );
                    camera.lookAt(pos);
                    break;
            }
        }

        // ================================================================
        // 17. BUCLE PRINCIPAL
        // ================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);

            if (document.getElementById('pause-menu').style.display !== 'flex') {
                updatePhysics(delta);
                updateCamera();
            }

            renderer.render(scene, camera);
        }

        // ================================================================
        // 18. INICIO
        // ================================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mostrar panel de preparación
        setTimeout(() => {
            document.getElementById('panel-preparacion').style.display = 'block';
            mostrarAlerta('🚜 PREPARA TU AVION', 'info');
        }, 500);

        // Cargar partida
        setTimeout(cargarPartida, 1000);

        animate();
    </script>
</body>
</html>
