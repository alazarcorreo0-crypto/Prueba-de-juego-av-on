<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación Despacho - Mejorada</title>
    <style>
        /* --- RESET Y FUENTES --- */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .app-container {
            width: 100%;
            max-width: 1000px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- BARRA SUPERIOR CON PESTAÑAS --- */
        .top-bar {
            background-color: #ffffff;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
        }

        .tabs {
            display: flex;
            gap: 5px;
        }

        .tab-btn {
            background-color: #f1f3f5;
            color: #495057;
            border: 1px solid #ced4da;
            padding: 6px 15px;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

        .tab-btn:hover:not(.active) {
            background-color: #e2e6ea;
        }

        .search-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0 10px;
            height: 32px;
            margin: 0 15px;
        }

        .search-container span {
            margin-right: 8px;
            color: #999;
            font-size: 14px;
        }

        .search-input {
            flex-grow: 1;
            border: none;
            background: transparent;
            font-size: 13px;
            outline: none;
            height: 100%;
        }

        .btn-approve {
            background-color: #1a9c6e;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }

        /* --- ÁREA DE CONTENIDO (Lista de camiones) --- */
        .content-area {
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow-y: auto;
            background-color: #e9ecef;
            padding: 10px;
            gap: 8px;
        }

        /* --- OCULTAR HISTORIAL INICIALMENTE --- */
        .history-view {
            display: none;
        }

        /* --- TARJETA INDIVIDUAL --- */
        .truck-card {
            display: flex;
            background-color: #ffffff;
            border: 1px solid #ddd;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
            position: relative;
        }

        /* --- PANEL IZQUIERDO (AZUL OSCURO) --- */
        .left-panel {
            width: 130px;
            background-color: #1a2b3c;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .ticket-number {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .truck-id {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .loads-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .loads-value {
            font-size: 18px;
            font-weight: 700;
        }

        /* --- PANEL DERECHO (DATOS) --- */
        .right-panel {
            flex-grow: 1;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 50px;
        }

        /* --- CABECERA DE LA TARJETA --- */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .date-row {
            display: flex;
            gap: 15px;
            font-weight: 600;
            color: #333;
        }

        .time-row {
            display: flex;
            gap: 10px;
            color: #555;
            font-size: 11px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-potatoes {
            background-color: #c49a45;
            color: #ffffff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* --- BOTÓN ÚNICO: SAVE + IMPRESORA --- */
        .btn-save-print {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .btn-save-print:hover {
            background-color: #2563eb;
        }

        .btn-save-print .icon {
            font-size: 18px;
        }

        /* --- CUERPO DE DATOS (3 COLUMNAS) --- */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px 20px;
            font-size: 13px;
        }

        .data-field {
            display: flex;
            flex-direction: column;
        }

        .data-field label {
            font-size: 11px;
            color: #666;
            margin-bottom: 3px;
            font-weight: 400;
        }

        /* --- INPUTS EDITABLES --- */
        .data-field input {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            border: none;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
            min-height: 24px;
            outline: none;
            background: transparent;
            width: 100%;
        }

        .data-field input:focus {
            border-bottom: 1px solid #3b82f6;
        }

        .data-field input[readonly] {
            color: #333;
            cursor: default;
        }

        /* --- CIRCULITO DE SELECCIÓN --- */
        .radio-circle {
            width: 22px;
            height: 22px;
            border: 2px solid #b0b0b0;
            border-radius: 50%;
            background-color: #ffffff;
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            transition: all 0.2s ease;
            box-shadow: 0 0 0 2px #ffffff;
            z-index: 10;
        }

        .radio-circle.selected {
            border-color: #3b82f6;
            background-color: #3b82f6;
            box-shadow: inset 0 0 0 3px #ffffff, 0 0 5px rgba(59, 130, 246, 0.5);
        }

        /* --- SCROLLBAR --- */
        .content-area::-webkit-scrollbar {
            width: 8px;
        }
        .content-area::-webkit-scrollbar-track {
            background: #e9ecef;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: #adb5bd;
            border-radius: 4px;
        }

        /* --- ESTILOS PARA LA VISTA DE HISTORIAL --- */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-item {
            background: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            color: #333;
        }
        .history-item strong {
            color: #1a2b3c;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Barra superior con Pestañas -->
    <div class="top-bar">
        <div class="tabs">
            <button class="tab-btn active" id="tabQueue">Queue</button>
            <button class="tab-btn" id="tabHistory">History</button>
        </div>
        <div class="search-container">
            <span>🔍</span>
            <input type="text" class="search-input" placeholder="Search for Crew, EG, Crop, Ticket Number">
        </div>
        <button class="btn-approve">Approve</button>
    </div>

    <!-- Contenedor Principal (Queue) -->
    <div class="content-area" id="queueView">
        <!-- Lista de Camiones -->
        <div id="truckList"></div>
    </div>

    <!-- Contenedor de Historial (Oculto inicialmente) -->
    <div class="content-area history-view" id="historyView">
        <div class="history-list" id="historyList">
            <!-- Se llena dinámicamente -->
            <p style="text-align:center; color:#666; margin-top:20px;">No hay registros en el historial todavía.</p>
        </div>
    </div>
</div>

<script>
    // 1. DATOS EXACTOS
    const trucksData = [
        { ticket: "3910", truckId: "R-20", loads: 1, date: "19 Sep", year: "2026", timeStart: "09:47:23 AM", timeEnd: "10:15:28 AM", implement: "GS Digger 24", field: "0083", offload: "N/A", storage: "N/A", netWeight: 35420, grossWeight: 57600, lightWeight: 22180 },
        { ticket: "3907", truckId: "R-19", loads: 1, date: "19 Sep", year: "2026", timeStart: "09:37:43 AM", timeEnd: "10:09:31 AM", implement: "GS Digger 19", field: "0083", offload: "N/A", storage: "N/A", netWeight: 35840, grossWeight: 57460, lightWeight: 21620 },
        { ticket: "3906", truckId: "R-13", loads: 1, date: "19 Sep", year: "2026", timeStart: "09:47:56 AM", timeEnd: "10:09:20 AM", implement: "GS Digger 14", field: "0032", offload: "N/A", storage: "N/A", netWeight: 35200, grossWeight: 57460, lightWeight: 22260 },
        { ticket: "3905", truckId: "106", loads: 1, date: "19 Sep", year: "2026", timeStart: "09:50:27 AM", timeEnd: "10:07:31 AM", implement: "GS Digger 17", field: "0032", offload: "N/A", storage: "N/A", netWeight: 34900, grossWeight: 57960, lightWeight: 23060 }
    ];

    const truckListContainer = document.getElementById('truckList');
    const historyListContainer = document.getElementById('historyList');
    const tabQueue = document.getElementById('tabQueue');
    const tabHistory = document.getElementById('tabHistory');
    const queueView = document.getElementById('queueView');
    const historyView = document.getElementById('historyView');

    // 2. FUNCIÓN PARA RENDERIZAR LAS TARJETAS
    function renderTrucks() {
        truckListContainer.innerHTML = '';

        trucksData.forEach((truck, index) => {
            const cardWrapper = document.createElement('div');
            cardWrapper.className = 'truck-card';
            cardWrapper.dataset.index = index;

            cardWrapper.innerHTML = `
                <div class="left-panel">
                    <div class="ticket-number">${truck.ticket}</div>
                    <div class="truck-id">${truck.truckId}</div>
                    <div class="loads-label">LOADS</div>
                    <div class="loads-value">${truck.loads}</div>
                </div>

                <div class="right-panel">
                    <div class="card-header">
                        <div class="header-left">
                            <div class="date-row">
                                <span>${truck.date}</span>
                                <span>${truck.year}</span>
                            </div>
                            <div class="time-row">
                                <span>${truck.timeStart}</span>
                                <span>-</span>
                                <span>${truck.timeEnd}</span>
                            </div>
                        </div>
                        <div class="header-right">
                            <span class="badge-potatoes">Potatoes</span>
                            <button class="btn-save-print" data-index="${index}">
                                <span class="icon">🖨️</span> Save
                            </button>
                        </div>
                    </div>

                    <div class="data-grid">
                        <div class="data-field">
                            <label>Implement</label>
                            <input type="text" value="${truck.implement}" readonly>
                        </div>
                        <div class="data-field">
                            <label>Field</label>
                            <input type="text" value="${truck.field}" readonly>
                        </div>
                        <div class="data-field">
                            <label>Offload Site</label>
                            <input type="text" value="${truck.offload}" readonly>
                        </div>
                        
                        <div class="data-field">
                            <label>Storage</label>
                            <input type="text" value="${truck.storage}" readonly>
                        </div>
                        <!-- Net Weight y Gross Weight son totalmente editables -->
                        <div class="data-field">
                            <label>Net Weight (lbs)</label>
                            <input type="number" class="editable-weight" value="${truck.netWeight}" data-field="netWeight" data-index="${index}">
                        </div>
                        <div class="data-field">
                            <label>Gross Weight (lbs)</label>
                            <input type="number" class="editable-weight" value="${truck.grossWeight}" data-field="grossWeight" data-index="${index}">
                        </div>

                        <div class="data-field">
                            <label>Light Weight (lbs)</label>
                            <input type="text" value="${truck.lightWeight}" readonly>
                        </div>
                    </div>
                </div>
                
                <div class="radio-circle" data-index="${index}"></div>
            `;

            truckListContainer.appendChild(cardWrapper);
        });

        attachEvents();
    }

    // 3. LÓGICA DE SELECCIÓN Y BOTÓN DE IMPRESIÓN
    let selectedIndex = null;

    function attachEvents() {
        // Evento para los círculos de selección
        document.querySelectorAll('.radio-circle').forEach(circle => {
            circle.addEventListener('click', function(e) {
                e.stopPropagation();
                const index = this.dataset.index;
                
                if (this.classList.contains('selected')) {
                    this.classList.remove('selected');
                    selectedIndex = null;
                } else {
                    document.querySelectorAll('.radio-circle').forEach(c => c.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedIndex = index;
                }
            });
        });

        // Evento para el botón único (Save + Print)
        document.querySelectorAll('.btn-save-print').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const index = this.dataset.index;

                // --- REGLA 1: Si NO hay nada seleccionado, no hace NADA ---
                if (selectedIndex === null) {
                    return; // Simplemente no hace nada, sin mensajes
                }

                // --- REGLA 2: Si el botón presionado NO es el seleccionado, no hace NADA ---
                if (selectedIndex !== index) {
                    return; 
                }

                // Si es el correcto, procedemos a imprimir
                processPrint(index, this);
            });
        });
    }

    // 4. FUNCIÓN DE IMPRESIÓN Y ENVÍO A HISTORIAL
    function processPrint(index, btnElement) {
        const truck = trucksData[index];
        
        // Obtenemos los valores ACTUALES de los inputs
        const netWeightInput = document.querySelector(`input[data-field="netWeight"][data-index="${index}"]`);
        const grossWeightInput = document.querySelector(`input[data-field="grossWeight"][data-index="${index}"]`);
        
        const netWeight = parseFloat(netWeightInput.value) || 0;
        const grossWeight = parseFloat(grossWeightInput.value) || 0;

        // --- REGLA 3: Si el Net Weight es menor a 50, no imprime NADA ---
        if (netWeight < 50) {
            return; // Simplemente no hace nada, sin mensajes
        }

        // Si pasa todas las validaciones, IMPRIMIR DIRECTAMENTE
        if (btnElement) {
            const originalHTML = btnElement.innerHTML;
            btnElement.innerHTML = '<span class="icon">⏳</span> Imprimiendo...';
            btnElement.style.backgroundColor = '#6b7280';
            
            setTimeout(() => {
                btnElement.innerHTML = '<span class="icon">✔</span> Impreso';
                btnElement.style.backgroundColor = '#10b981';
                
                setTimeout(() => {
                    // --- ACCIÓN: Mover a Historial ---
                    moveToHistory(index, netWeight, grossWeight);
                    
                    btnElement.innerHTML = originalHTML;
                    btnElement.style.backgroundColor = '#3b82f6';
                }, 1000);
            }, 800);
        }
    }

    // 5. FUNCIÓN PARA MOVER A HISTORIAL
    function moveToHistory(index, netWeight, grossWeight) {
        const truck = trucksData[index];
        
        // 1. Crear el elemento en el historial
        const historyItem = document.createElement('div');
        historyItem.className = 'history-item';
        historyItem.innerHTML = `
            <span><strong>Ticket:</strong> ${truck.ticket} | <strong>Troque:</strong> ${truck.truckId}</span>
            <span><strong>Net:</strong> ${netWeight} lbs | <strong>Gross:</strong> ${grossWeight} lbs</span>
            <span style="color: #10b981; font-weight: bold;">✔ Impreso</span>
        `;
        
        if (historyListContainer.querySelector('p')) {
            historyListContainer.innerHTML = '';
        }
        
        historyListContainer.appendChild(historyItem);

        // 2. Eliminar la tarjeta de la vista de Queue
        const cardToRemove = document.querySelector(`.truck-card[data-index="${index}"]`);
        if (cardToRemove) {
            cardToRemove.remove();
        }

        // 3. Limpiar la selección
        selectedIndex = null;
        
        console.log(`✅ Ticket ${truck.ticket} movido a Historial.`);
    }

    // 6. LÓGICA DE PESTAÑAS (TABS)
    tabQueue.addEventListener('click', () => {
        tabQueue.classList.add('active');
        tabHistory.classList.remove('active');
        queueView.style.display = 'flex';
        historyView.style.display = 'none';
    });

    tabHistory.addEventListener('click', () => {
        tabHistory.classList.add('active');
        tabQueue.classList.remove('active');
        queueView.style.display = 'none';
        historyView.style.display = 'flex';
    });

    // Iniciar
    renderTrucks();
</script>

</body>
</html>
