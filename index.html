<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AgroFlight Pro - Simulador Agrícola</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            position: fixed;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* ==================== HUD PRINCIPAL ==================== */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 10px;
            pointer-events: none;
            z-index: 10;
            min-width: 160px;
            backdrop-filter: blur(8px);
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            font-size: 9px;
        }
        .hud-val {
            font-weight: bold;
            font-family: 'Courier New', monospace;
            font-size: 10px;
        }
        .hud-val.alt { color: #38bdf8; }
        .hud-val.spd { color: #facc15; }
        .hud-val.pwr { color: #f97316; }
        .hud-val.cov { color: #4ade80; }
        .hud-val.credits { color: #fbbf24; }

        .tank-bar-outer {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        .tank-bar-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #06b6d4);
            transition: width 0.2s;
        }

        /* ==================== ALERTAS ==================== */
        #alert-banner {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 15;
            text-align: center;
            backdrop-filter: blur(4px);
            min-width: 200px;
            max-width: 90%;
        }
        #alert-banner.spray { opacity: 1; background: rgba(16, 185, 129, 0.9); color: #064e3b; }
        #alert-banner.warn { opacity: 1; background: rgba(239, 68, 68, 0.9); color: #fff; animation: blink 0.5s infinite alternate; }
        #alert-banner.info { opacity: 1; background: rgba(59, 130, 246, 0.9); color: #fff; }
        #alert-banner.success { opacity: 1; background: rgba(16, 185, 129, 0.9); color: #064e3b; }

        @keyframes blink {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* ==================== HORIZONTE ARTIFICIAL ==================== */
        #artificial-horizon {
            position: absolute;
            bottom: 220px;
            left: 15px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #38bdf8, #1e3a8a);
            border: 2px solid rgba(255,255,255,0.4);
            z-index: 10;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: none;
        }
        #horizon-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: white;
            transition: transform 0.1s;
        }
        #horizon-pitch {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%;
        }
        #horizon-label {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 6px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.5px;
        }

        /* ==================== PALANCA DE POTENCIA ==================== */
        #throttle-container {
            position: absolute;
            right: 15px;
            bottom: 200px;
            width: 50px;
            height: 150px;
            background: rgba(0,0,0,0.7);
            border-radius: 25px;
            z-index: 25;
            border: 2px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            touch-action: none;
        }
        #throttle-track {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: calc(100% - 20px);
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        #throttle-handle {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 36px;
            background: radial-gradient(circle at 30% 30%, #f97316, #ea580c);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 20px rgba(249,115,22,0.3);
            transition: bottom 0.05s;
            cursor: pointer;
            touch-action: none;
        }
        #throttle-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 9px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #throttle-icons {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
        }
        #throttle-icons.top { top: 5px; }
        #throttle-icons.bottom { bottom: 5px; }

        /* ==================== JOYSTICK ==================== */
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, rgba(0,0,0,0.5), rgba(0,0,0,0.8));
            border: 3px solid rgba(255,255,255,0.15);
            z-index: 20;
            backdrop-filter: blur(4px);
            touch-action: none;
            display: none;
        }
        #joystick-base {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(74,222,128,0.2), transparent);
            border: 2px solid rgba(255,255,255,0.1);
        }
        #joystick-thumb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #4ade80, #059669);
            box-shadow: 0 0 30px rgba(74,222,128,0.2);
            cursor: pointer;
            touch-action: none;
            transition: all 0.05s;
        }
        #joystick-thumb:active {
            transform: translate(-50%, -50%) scale(0.9);
        }
        .joystick-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
        }
        .joystick-ring.r1 { width: 90px; height: 90px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .joystick-ring.r2 { width: 110px; height: 110px; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        /* ==================== BOTONES DE CONTROL ==================== */
        #control-buttons {
            position: absolute;
            bottom: 180px;
            right: 80px;
            display: flex;
            gap: 8px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 12px;
            font-size: 9px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ctrl-btn:active { transform: scale(0.92); }
        .ctrl-btn.spray { background: rgba(16, 185, 129, 0.7); border: 1px solid rgba(16, 185, 129, 0.5); }
        .ctrl-btn.flaps { background: rgba(59, 130, 246, 0.7); border: 1px solid rgba(59, 130, 246, 0.5); }
        .ctrl-btn.brake { background: rgba(239, 68, 68, 0.7); border: 1px solid rgba(239, 68, 68, 0.5); }
        .ctrl-btn.rescue { background: rgba(251, 191, 36, 0.7); border: 1px solid rgba(251, 191, 36, 0.5); }
        .ctrl-btn.active { background: rgba(16, 185, 129, 0.9); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }

        /* ==================== PANEL DE CONTROL ==================== */
        #control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 200px;
        }
        .panel-btn {
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 9px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .panel-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
        .panel-btn.shop { border-color: rgba(251, 191, 36, 0.4); color: #fbbf24; }
        .panel-btn.mission { border-color: rgba(16, 185, 129, 0.4); color: #4ade80; }
        .panel-btn.save { border-color: rgba(59, 130, 246, 0.4); color: #38bdf8; }

        /* ==================== MINI-MAPA ==================== */
        #minimap {
            position: absolute;
            bottom: 220px;
            right: 15px;
            width: 100px;
            height: 100px;
            border-radius: 12px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            overflow: hidden;
            backdrop-filter: blur(4px);
            display: none;
        }
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
        #minimap-label {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 6px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
        }

        /* ==================== MODO GIROSCOPIO ==================== */
        #gyro-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(56, 189, 248, 0.3);
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: rgba(255,255,255,0.5);
        }
        #gyro-indicator.active {
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }
        #gyro-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #38bdf8;
            transition: all 0.05s;
        }

        /* ==================== MENÚ DE PAUSA ==================== */
        #pause-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        #pause-menu .menu-box {
            background: rgba(15, 23, 42, 0.95);
            padding: 30px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        #pause-menu h2 {
            color: #4ade80;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-btn:hover { background: rgba(255,255,255,0.1); }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn.primary { background: rgba(16, 185, 129, 0.3); border-color: rgba(16, 185, 129, 0.3); }
        .menu-btn.danger { background: rgba(239, 68, 68, 0.3); border-color: rgba(239, 68, 68, 0.3); }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 600px) {
            #hud { font-size: 8px; padding: 6px 10px; min-width: 120px; }
            .hud-row { font-size: 8px; }
            .hud-val { font-size: 9px; }
            #throttle-container { width: 40px; height: 120px; right: 10px; bottom: 160px; }
            #throttle-handle { width: 30px; height: 30px; }
            #throttle-label { font-size: 7px; }
            #joystick-container { width: 110px; height: 110px; bottom: 20px; }
            #joystick-thumb { width: 42px; height: 42px; }
            #control-buttons { bottom: 150px; right: 60px; gap: 5px; }
            .ctrl-btn { padding: 6px 10px; font-size: 7px; }
            #artificial-horizon { width: 60px; height: 60px; bottom: 180px; left: 10px; }
            #minimap { width: 80px; height: 80px; bottom: 180px; right: 10px; }
            #control-panel { top: 5px; right: 5px; gap: 4px; max-width: 150px; }
            .panel-btn { padding: 4px 8px; font-size: 7px; }
            #pause-menu .menu-box { padding: 20px; }
            #pause-menu h2 { font-size: 16px; }
            .menu-btn { padding: 10px; font-size: 12px; }
            #alert-banner { font-size: 10px; padding: 6px 14px; min-width: 150px; top: 50px; }
        }
        @media (min-width: 768px) {
            #joystick-container { display: block !important; }
            #artificial-horizon { display: block !important; }
            #minimap { display: block !important; }
            #gyro-indicator { display: none !important; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            #hud { font-size: 7px; padding: 4px 8px; min-width: 100px; }
            #throttle-container { height: 100px; right: 8px; bottom: 140px; width: 35px; }
            #joystick-container { width: 90px; height: 90px; bottom: 15px; }
            #joystick-thumb { width: 36px; height: 36px; }
            #control-buttons { bottom: 130px; right: 50px; }
            .ctrl-btn { padding: 4px 8px; font-size: 6px; }
            #artificial-horizon { width: 50px; height: 50px; bottom: 150px; left: 8px; }
            #minimap { width: 60px; height: 60px; bottom: 150px; right: 8px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- ==================== HUD ==================== -->
    <div id="hud">
        <div class="hud-row"><span>ALTITUD:</span> <span class="hud-val alt" id="val-alt">0m</span></div>
        <div class="hud-row"><span>VELOCIDAD:</span> <span class="hud-val spd" id="val-spd">0 km/h</span></div>
        <div class="hud-row"><span>POTENCIA:</span> <span class="hud-val pwr" id="val-pwr">0%</span></div>
        <div class="hud-row"><span>MARCADO:</span> <span class="hud-val cov" id="val-cov">0 ha</span></div>
        <div class="hud-row"><span>💰 CRÉDITOS:</span> <span class="hud-val credits" id="val-credits">$500</span></div>
        <div class="tank-bar-outer"><div class="tank-bar-inner" id="bar-tank"></div></div>
    </div>

    <!-- ==================== ALERTAS ==================== -->
    <div id="alert-banner">BIENVENIDO PILOTO</div>

    <!-- ==================== HORIZONTE ARTIFICIAL ==================== -->
    <div id="artificial-horizon">
        <div id="horizon-line"></div>
        <div id="horizon-pitch"></div>
        <div id="horizon-label">HORIZONTE</div>
    </div>

    <!-- ==================== PALANCA DE POTENCIA ==================== -->
    <div id="throttle-container">
        <div id="throttle-icons" class="top">▲</div>
        <div id="throttle-track">
            <div id="throttle-handle">
                <div id="throttle-label">0%</div>
            </div>
        </div>
        <div id="throttle-icons" class="bottom">▼</div>
    </div>

    <!-- ==================== JOYSTICK ==================== -->
    <div id="joystick-container">
        <div class="joystick-ring r1"></div>
        <div class="joystick-ring r2"></div>
        <div id="joystick-base">
            <div id="joystick-thumb"></div>
        </div>
    </div>

    <!-- ==================== CONTROL GIROSCOPIO ==================== -->
    <div id="gyro-indicator">
        <div id="gyro-dot"></div>
    </div>

    <!-- ==================== MINI-MAPA ==================== -->
    <div id="minimap">
        <canvas id="minimap-canvas"></canvas>
        <div id="minimap-label">GPS</div>
    </div>

    <!-- ==================== BOTONES DE CONTROL ==================== -->
    <div id="control-buttons">
        <button class="ctrl-btn spray" id="btn-spray">💨 SPRAY</button>
        <button class="ctrl-btn flaps" id="btn-flaps">🔄 FLAPS</button>
        <button class="ctrl-btn brake" id="btn-brake">🛑 FRENO</button>
        <button class="ctrl-btn rescue" id="btn-rescue">🚁 RESCATE</button>
    </div>

    <!-- ==================== PANEL SUPERIOR ==================== -->
    <div id="control-panel">
        <button class="panel-btn shop" id="btn-shop">🏪 TIENDA</button>
        <button class="panel-btn mission" id="btn-mission">📋 MISIÓN</button>
        <button class="panel-btn save" id="btn-save">💾 GUARDAR</button>
        <button class="panel-btn" id="btn-pause">⏸️ PAUSA</button>
        <button class="panel-btn" id="btn-cam">📷 CAM</button>
    </div>

    <!-- ==================== MENÚ DE PAUSA ==================== -->
    <div id="pause-menu">
        <div class="menu-box">
            <h2>⏸️ PAUSA</h2>
            <button class="menu-btn primary" id="btn-resume">▶️ CONTINUAR</button>
            <button class="menu-btn" id="btn-save-menu">💾 GUARDAR PARTIDA</button>
            <button class="menu-btn" id="btn-load-menu">📂 CARGAR PARTIDA</button>
            <button class="menu-btn" id="btn-restart">🔄 REINICIAR</button>
            <button class="menu-btn danger" id="btn-quit">🚪 SALIR</button>
        </div>
    </div>

    <!-- ==================== SCRIPT PRINCIPAL ==================== -->
    <script>
        // ================================================================
        // 1. CONFIGURACIÓN Y ESTADO GLOBAL
        // ================================================================
        const CONFIG = {
            gravedad: 9.8,
            maxPotencia: 100,
            stallSpeed: 50,
            maxAltitud: 150,
            anchoAspersionBase: 13.5,
        };

        const estado = {
            creditos: 500,
            mejoras: { motor: 0, tanque: 0, presion: 0, boquilla: 0 },
            misiones: [],
            misionActual: null,
            areaMision: 0,
            horasVuelo: 0,
            hectareas: 0,
            partidasGuardadas: []
        };

        // ================================================================
        // 2. INICIALIZACIÓN THREE.JS
        // ================================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.0008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
        dirLight.position.set(200, 400, 200);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // ================================================================
        // 3. TERRENO
        // ================================================================
        const groundGeo = new THREE.PlaneGeometry(3000, 3000);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x4a7c20 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Pista
        const runwayMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const runway = new THREE.Mesh(new THREE.PlaneGeometry(30, 400), runwayMat);
        runway.rotation.x = -Math.PI / 2;
        runway.position.set(0, 0.1, -100);
        runway.receiveShadow = true;
        scene.add(runway);

        // Marcas de pista
        for (let i = -180; i <= 180; i += 20) {
            const mark = new THREE.Mesh(
                new THREE.PlaneGeometry(2, 8),
                new THREE.MeshLambertMaterial({ color: 0xffffff })
            );
            mark.rotation.x = -Math.PI / 2;
            mark.position.set(0, 0.2, i - 100);
            scene.add(mark);
        }

        // Parcelas
        const cropColors = [0x2e7d32, 0x388e3c, 0x43a047, 0x4caf50, 0x558b2f, 0x689f38, 0x7cb342, 0x8bc34a];
        const campos = [];
        for (let x = -800; x <= 800; x += 350) {
            for (let z = -800; z <= 800; z += 350) {
                if (Math.abs(x) < 200 && Math.abs(z) < 300) continue;
                const color = cropColors[Math.floor(Math.random() * cropColors.length)];
                const campo = new THREE.Mesh(
                    new THREE.PlaneGeometry(300, 300),
                    new THREE.MeshLambertMaterial({ color })
                );
                campo.rotation.x = -Math.PI / 2;
                campo.position.set(x, 0.15, z);
                campo.receiveShadow = true;
                scene.add(campo);
                campos.push({ x, z, mesh: campo, fumigado: false });
            }
        }

        // ================================================================
        // 4. OBSTÁCULOS
        // ================================================================
        const obstacles = [];
        const poleMat = new THREE.MeshLambertMaterial({ color: 0x64748b });
        const wireMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
        const treeTrunkMat = new THREE.MeshLambertMaterial({ color: 0x5c3d11 });
        const treeLeavesMat = new THREE.MeshLambertMaterial({ color: 0x1b4332 });

        function createPowerLines(startZ, endZ, posX) {
            let prev = null;
            for (let z = startZ; z <= endZ; z += 120) {
                const group = new THREE.Group();
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 18), poleMat);
                pole.position.y = 9;
                pole.castShadow = true;
                group.add(pole);
                const cross = new THREE.Mesh(new THREE.BoxGeometry(6, 0.3, 0.3), poleMat);
                cross.position.y = 17;
                cross.castShadow = true;
                group.add(cross);
                group.position.set(posX, 0, z);
                scene.add(group);
                obstacles.push({ x: posX, y: 9, z, radius: 3, height: 18, type: 'poste' });
                if (prev) {
                    const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 120), wireMat);
                    wire.position.set(posX, 17, z - 60);
                    wire.rotation.x = Math.PI / 2;
                    scene.add(wire);
                }
                prev = { x: posX, y: 17, z };
            }
        }
        createPowerLines(-600, 600, 160);
        createPowerLines(-600, 600, -160);

        for (let i = 0; i < 80; i++) {
            const tx = (Math.random() - 0.5) * 1600;
            const tz = (Math.random() - 0.5) * 1600;
            if (Math.abs(tx) < 180 && Math.abs(tz) < 300) continue;
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 6), treeTrunkMat);
            trunk.position.y = 3;
            trunk.castShadow = true;
            tree.add(trunk);
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(5, 14, 6), treeLeavesMat);
            leaves.position.y = 10;
            leaves.castShadow = true;
            tree.add(leaves);
            tree.position.set(tx, 0, tz);
            scene.add(tree);
            obstacles.push({ x: tx, y: 7, z: tz, radius: 4, height: 14, type: 'arbol' });
        }

        // ================================================================
        // 5. AVIÓN (MEJORADO)
        // ================================================================
        const airplane = new THREE.Group();
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0xfacc15 });
        const accentMat = new THREE.MeshLambertMaterial({ color: 0x1d4ed8 });
        const darkMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
        const glassMat = new THREE.MeshLambertMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.7 });
        const metalMat = new THREE.MeshLambertMaterial({ color: 0x94a3b8 });
        const redMat = new THREE.MeshLambertMaterial({ color: 0xef4444 });

        // Fuselaje
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.0, 7.5), bodyMat);
        body.position.y = 1.3;
        body.castShadow = true;
        airplane.add(body);

        // Morro
        const nose = new THREE.Mesh(new THREE.ConeGeometry(1.0, 2.5, 8), accentMat);
        nose.position.set(0, 1.2, -4.8);
        nose.rotation.x = Math.PI / 2;
        nose.castShadow = true;
        airplane.add(nose);

        // Cabina
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.3, 2.2), glassMat);
        cabin.position.set(0, 2.5, 0.3);
        cabin.castShadow = true;
        airplane.add(cabin);

        // Ala
        const wing = new THREE.Mesh(new THREE.BoxGeometry(15, 0.15, 2.5), bodyMat);
        wing.position.set(0, 1.3, -0.8);
        wing.castShadow = true;
        airplane.add(wing);

        // Barra de aspersión
        const sprayBarMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
        const sprayBar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 14.5), sprayBarMat);
        sprayBar.rotation.z = Math.PI / 2;
        sprayBar.position.set(0, 0.6, -0.1);
        airplane.add(sprayBar);

        // Hélice
        const propGroup = new THREE.Group();
        const propHub = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.5), darkMat);
        propHub.rotation.x = Math.PI / 2;
        propGroup.add(propHub);
        const bladeMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
        for (let i = 0; i < 2; i++) {
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.8, 0.05), bladeMat);
            blade.position.y = (i === 0) ? 1.4 : -1.4;
            propGroup.add(blade);
        }
        propGroup.position.set(0, 1.2, -5.5);
        airplane.add(propGroup);

        // Tren de aterrizaje
        const gearMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
        for (let side = -1; side <= 1; side += 2) {
            const gearLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.6), gearMat);
            gearLeg.position.set(side * 1.2, 0.1, 0.5);
            airplane.add(gearLeg);
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.08), darkMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(side * 1.2, 0.05, 0.5);
            airplane.add(wheel);
        }

        airplane.position.set(0, 1, 80);
        scene.add(airplane);

        // ================================================================
        // 6. SISTEMA DE ASPERSIÓN
        // ================================================================
        const sprayedTracks = [];
        const trackMat = new THREE.MeshLambertMaterial({ color: 0x1b4332, transparent: true, opacity: 0.6 });
        let areaCoveredSqm = 0;

        function paintSwath() {
            if (airplane.position.y > 10) return;
            const ancho = CONFIG.anchoAspersionBase + (estado.mejoras.boquilla * 1.5);
            const track = new THREE.Mesh(new THREE.PlaneGeometry(ancho, 3), trackMat);
            track.rotation.x = -Math.PI / 2;
            track.rotation.z = airplane.rotation.y;
            track.position.set(airplane.position.x, 0.2, airplane.position.z);
            scene.add(track);
            sprayedTracks.push(track);
            areaCoveredSqm += ancho * 3;
            estado.areaMision += ancho * 3;
            estado.hectareas += (ancho * 3) / 10000;
        }

        // Partículas
        const particleCount = 400;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 2.5,
            transparent: true,
            opacity: 0.7,
            color: 0x00ffff,
            blending: THREE.NormalBlending,
            depthWrite: false
        });
        const sprayParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(sprayParticles);
        let particleIdx = 0;

        function emitSpray() {
            if (!isSpraying || tankLevel <= 0 || avionEstado !== 'volando') return;
            const pos = sprayParticles.geometry.attributes.position.array;
            const ancho = CONFIG.anchoAspersionBase + (estado.mejoras.boquilla * 1.5);
            for (let i = -ancho / 2; i <= ancho / 2; i += 1.2) {
                const pt = new THREE.Vector3(i, 0.8, -0.1).applyMatrix4(airplane.matrixWorld);
                pos[particleIdx * 3] = pt.x + (Math.random() - 0.5) * 0.8;
                pos[particleIdx * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.5;
                pos[particleIdx * 3 + 2] = pt.z + (Math.random() - 0.5) * 0.8;
                particleIdx = (particleIdx + 1) % particleCount;
            }
            sprayParticles.geometry.attributes.position.needsUpdate = true;
            paintSwath();
        }

        // ================================================================
        // 7. VARIABLES DE CONTROL
        // ================================================================
        let avionEstado = 'tierra';
        let throttle = 0;
        let speed = 0;
        let pitch = 0;
        let roll = 0;
        let yaw = 0;
        let isSpraying = false;
        let tankLevel = 0;
        let cameraMode = 0;
        let flaps = 0;
        let brake = false;
        let throttleTarget = 0;
        let altitude = 1;

        // Joystick state
        let joyX = 0;
        let joyY = 0;
        let isJoystickActive = false;

        // ================================================================
        // 8. CONTROL POR JOYSTICK
        // ================================================================
        const joystickContainer = document.getElementById('joystick-container');
        const joystickThumb = document.getElementById('joystick-thumb');
        let joystickDrag = false;

        function initJoystick() {
            const start = (e) => {
                e.preventDefault();
                joystickDrag = true;
                updateJoystick(e);
            };
            const move = (e) => {
                e.preventDefault();
                if (joystickDrag) updateJoystick(e);
            };
            const end = (e) => {
                e.preventDefault();
                joystickDrag = false;
                joyX = 0;
                joyY = 0;
                joystickThumb.style.transform = 'translate(-50%, -50%)';
            };

            joystickContainer.addEventListener('touchstart', start, { passive: false });
            joystickContainer.addEventListener('touchmove', move, { passive: false });
            joystickContainer.addEventListener('touchend', end, { passive: false });
            joystickContainer.addEventListener('touchcancel', end, { passive: false });

            // Mouse support
            joystickContainer.addEventListener('mousedown', start);
            document.addEventListener('mousemove', (e) => {
                if (joystickDrag) updateJoystick(e);
            });
            document.addEventListener('mouseup', end);
        }

        function updateJoystick(e) {
            const rect = joystickContainer.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const maxDist = rect.width / 2 - 20;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let dx = (clientX - cx) / maxDist;
            let dy = (clientY - cy) / maxDist;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 1) {
                dx /= dist;
                dy /= dist;
            }

            joyX = Math.max(-1, Math.min(1, dx));
            joyY = Math.max(-1, Math.min(1, -dy));

            const thumbX = joyX * maxDist;
            const thumbY = joyY * -maxDist;
            joystickThumb.style.transform = `translate(calc(-50% + ${thumbX}px), calc(-50% + ${thumbY}px))`;
        }

        initJoystick();

        // ================================================================
        // 9. CONTROL POR GIROSCOPIO
        // ================================================================
        let gyroEnabled = false;
        let gyroPitch = 0;
        let gyroRoll = 0;

        function initGyro() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    if (gyroEnabled) {
                        gyroPitch = -e.beta / 90;
                        gyroRoll = e.gamma / 45;
                    }
                });
                // Solicitar permiso en iOS
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(state => {
                        if (state === 'granted') gyroEnabled = true;
                    });
                } else {
                    gyroEnabled = true;
                }
                document.getElementById('gyro-indicator').style.display = 'flex';
                document.getElementById('gyro-indicator').classList.add('active');
            }
        }

        // ================================================================
        // 10. FUNCIONES DE FÍSICA
        // ================================================================
        function updatePhysics(delta) {
            if (avionEstado === 'tierra') return;

            // --- Potencia ---
            if (throttle < throttleTarget) {
                throttle = Math.min(throttleTarget, throttle + 50 * delta);
            } else if (throttle > throttleTarget) {
                throttle = Math.max(throttleTarget, throttle - 50 * delta);
            }

            // --- Velocidad ---
            const motorBonus = 1 + (estado.mejoras.motor * 0.15);
            const drag = 0.02 + (pitch * 0.01);
            const thrust = (throttle / 100) * 120 * motorBonus;
            speed += (thrust - speed * speed * drag - 0.5) * delta;
            speed = Math.max(0, speed);

            // --- Controles ---
            const ctrlSens = Math.min(1, speed / 30);

            // Cabeceo (joystick Y)
            let pitchInput = joyY;
            if (gyroEnabled && document.getElementById('gyro-indicator').style.display !== 'none') {
                pitchInput = gyroPitch;
            }
            pitch += (pitchInput * 1.2 - pitch * 0.3) * delta * 4 * ctrlSens;
            pitch = Math.max(-0.6, Math.min(0.6, pitch));

            // Alabeo (joystick X)
            let rollInput = joyX;
            if (gyroEnabled && document.getElementById('gyro-indicator').style.display !== 'none') {
                rollInput = gyroRoll;
            }
            roll += (rollInput * 1.5 - roll * 0.3) * delta * 4 * ctrlSens;
            roll = Math.max(-0.8, Math.min(0.8, roll));

            // --- Aplicar rotaciones ---
            airplane.rotation.x = pitch * 0.6;
            airplane.rotation.z = -roll * 0.7;
            yaw += (-roll * 1.0) * delta * ctrlSens;
            airplane.rotation.y = yaw;

            // --- Movimiento ---
            const speedFactor = speed / 3.6 * (brake ? 0.3 : 1);
            airplane.translateOnAxis(new THREE.Vector3(0, 0, -1), speedFactor * delta);

            // --- Gravedad y sustentación ---
            const lift = speed * 0.035 * (1 + pitch * 0.5) * (1 - flaps * 0.05);
            const weight = 0.5 + (tankLevel / 100) * 0.3;
            const gravity = 2.5 * weight * delta;
            altitude += (lift - gravity) * delta;
            altitude = Math.max(0.2, Math.min(CONFIG.maxAltitud, altitude));
            airplane.position.y = altitude;

            // --- Stall ---
            if (speed < CONFIG.stallSpeed && altitude > 1) {
                airplane.rotation.z += (Math.random() - 0.5) * 0.01;
                if (Math.random() < 0.01) {
                    mostrarAlerta('🚨 ¡PÉRDIDA! (Stall)', 'warn');
                }
            }

            // --- Aspersión ---
            if (isSpraying && tankLevel > 0) {
                const consumo = 3.5 + (estado.mejoras.presion * 0.3);
                tankLevel = Math.max(0, tankLevel - consumo * delta);
                emitSpray();
                document.getElementById('bar-tank').style.width = (tankLevel / 100 * 100) + '%';
                if (tankLevel <= 0) {
                    isSpraying = false;
                    document.getElementById('btn-spray').classList.remove('active');
                    mostrarAlerta('⛽ TANQUE VACÍO', 'warn');
                }
            }

            // --- Colisiones ---
            const planePos = airplane.position;
            for (let obs of obstacles) {
                const dist = Math.sqrt(Math.pow(planePos.x - obs.x, 2) + Math.pow(planePos.z - obs.z, 2));
                if (dist < obs.radius + 2 && altitude < obs.height) {
                    mostrarAlerta('🚨 ¡PELIGRO: OBSTÁCULO!', 'warn');
                    speed *= 0.7;
                    throttle = Math.max(0, throttle - 20);
                    break;
                }
            }

            // --- Aterrizaje ---
            if (altitude < 0.5 && Math.abs(planePos.z) < 50 && speed < 30) {
                if (avionEstado === 'volando') {
                    aterrizar();
                }
            }

            // --- Actualizar HUD ---
            document.getElementById('val-alt').textContent = Math.round(altitude) + 'm';
            document.getElementById('val-spd').textContent = Math.round(speed) + ' km/h';
            document.getElementById('val-pwr').textContent = Math.round(throttle) + '%';
            document.getElementById('val-cov').textContent = (areaCoveredSqm / 10000).toFixed(2) + ' ha';
            document.getElementById('val-credits').textContent = '$' + estado.creditos;

            // Horizonte artificial
            const horizonLine = document.getElementById('horizon-line');
            horizonLine.style.transform = `rotate(${roll * 60}deg)`;
            const pitchOffset = pitch * 30;
            horizonLine.style.top = `calc(50% + ${pitchOffset}%)`;
        }

        // ================================================================
        // 11. FUNCIONES DE CONTROL
        // ================================================================
        function aterrizar() {
            avionEstado = 'tierra';
            isSpraying = false;
            document.getElementById('btn-spray').classList.remove('active');
            throttle = 0;
            throttleTarget = 0;
            document.getElementById('throttle-handle').style.bottom = '0%';
            document.getElementById('throttle-label').textContent = '0%';
            mostrarAlerta('🛬 ATERRIZAJE EXITOSO', 'success');
            setTimeout(() => {
                document.getElementById('panel-preparacion').style.display = 'block';
                mostrarAlerta('🔄 PREPARA TU AVION PARA LA PRÓXIMA MISIÓN', 'info');
            }, 1500);
        }

        function toggleSpray() {
            if (avionEstado !== 'volando') {
                mostrarAlerta('⚠️ Debes estar en vuelo', 'warn');
                return;
            }
            if (tankLevel <= 0) {
                mostrarAlerta('⚠️ Tanque vacío', 'warn');
                return;
            }
            isSpraying = !isSpraying;
            document.getElementById('btn-spray').classList.toggle('active');
            mostrarAlerta(isSpraying ? '💨 ASPERSIÓN ACTIVA' : '⏸️ ASPERSIÓN PAUSADA', isSpraying ? 'spray' : 'info');
        }

        function toggleFlaps() {
            flaps = (flaps + 1) % 4;
            const angle = flaps * 10;
            mostrarAlerta(`🔄 FLAPS ${angle}°`, 'info');
        }

        function toggleBrake() {
            brake = !brake;
            document.getElementById('btn-brake').classList.toggle('active');
            mostrarAlerta(brake ? '🛑 FRENOS ACTIVADOS' : 'FRENOS DESACTIVADOS', brake ? 'warn' : 'info');
        }

        function rescuePlane() {
            if (avionEstado === 'tierra') {
                mostrarAlerta('⚠️ Ya estás en tierra', 'warn');
                return;
            }
            const costo = 100 + Math.abs(airplane.position.x) / 10;
            if (estado.creditos < costo) {
                mostrarAlerta(`💰 Créditos insuficientes ($${costo})`, 'warn');
                return;
            }
            estado.creditos -= costo;
            mostrarAlerta(`🚁 RESCATANDO AVION... -$${costo}`, 'info');
            setTimeout(() => {
                airplane.position.set(0, 1, 80);
                altitude = 1;
                speed = 0;
                throttle = 0;
                throttleTarget = 0;
                pitch = 0;
                roll = 0;
                yaw = 0;
                avionEstado = 'tierra';
                tankLevel = 0;
                isSpraying = false;
                document.getElementById('btn-spray').classList.remove('active');
                document.getElementById('bar-tank').style.width = '0%';
                document.getElementById('throttle-handle').style.bottom = '0%';
                document.getElementById('throttle-label').textContent = '0%';
                mostrarAlerta('🛬 AVION RESCATADO EN LA PISTA', 'success');
                document.getElementById('panel-preparacion').style.display = 'block';
            }, 2000);
        }

        // ================================================================
        // 12. SISTEMA DE GUARDADO
        // ================================================================
        function guardarPartida() {
            const data = {
                creditos: estado.creditos,
                mejoras: estado.mejoras,
                hectareas: estado.hectareas,
                horasVuelo: estado.horasVuelo,
                areaCoveredSqm: areaCoveredSqm,
                misionActual: estado.misionActual,
                areaMision: estado.areaMision,
                timestamp: Date.now()
            };
            localStorage.setItem('agroflight_save', JSON.stringify(data));
            mostrarAlerta('💾 PARTIDA GUARDADA', 'success');
        }

        function cargarPartida() {
            const raw = localStorage.getItem('agroflight_save');
            if (!raw) {
                mostrarAlerta('📂 No hay partida guardada', 'warn');
                return;
            }
            try {
                const data = JSON.parse(raw);
                estado.creditos = data.creditos || 500;
                estado.mejoras = data.mejoras || { motor: 0, tanque: 0, presion: 0, boquilla: 0 };
                estado.hectareas = data.hectareas || 0;
                estado.horasVuelo = data.horasVuelo || 0;
                areaCoveredSqm = data.areaCoveredSqm || 0;
                estado.areaMision = data.areaMision || 0;
                mostrarAlerta('📂 PARTIDA CARGADA', 'success');
                actualizarHUD();
            } catch (e) {
                mostrarAlerta('⚠️ Error al cargar partida', 'warn');
            }
        }

        function actualizarHUD() {
            document.getElementById('val-credits').textContent = '$' + estado.creditos;
            document.getElementById('val-cov').textContent = (areaCoveredSqm / 10000).toFixed(2) + ' ha';
        }

        // ================================================================
        // 13. FUNCIONES DE UI
        // ================================================================
        function mostrarAlerta(msg, tipo = 'info') {
            const banner = document.getElementById('alert-banner');
            banner.textContent = msg;
            banner.className = tipo;
            clearTimeout(banner._timeout);
            banner._timeout = setTimeout(() => { banner.className = ''; }, 3000);
        }

        function togglePause() {
            const menu = document.getElementById('pause-menu');
            if (menu.style.display === 'flex') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'flex';
            }
        }

        // ================================================================
        // 14. INICIALIZACIÓN DE CONTROLES
        // ================================================================
        // Palanca de potencia
        const throttleHandle = document.getElementById('throttle-handle');
        let throttleDrag = false;

        function updateThrottle(e) {
            const rect = document.getElementById('throttle-container').getBoundingClientRect();
            const trackRect = document.getElementById('throttle-track').getBoundingClientRect();
            let clientY;
            if (e.touches) {
                clientY = e.touches[0].clientY;
            } else {
                clientY = e.clientY;
            }
            const y = clientY - trackRect.top;
            const percent = 1 - Math.max(0, Math.min(1, y / trackRect.height));
            const value = Math.round(percent * 100);
            throttleHandle.style.bottom = percent * 100 + '%';
            document.getElementById('throttle-label').textContent = value + '%';
            throttleTarget = value;
        }

        throttleHandle.addEventListener('touchstart', (e) => {
            e.preventDefault();
            throttleDrag = true;
            updateThrottle(e);
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (throttleDrag) {
                e.preventDefault();
                updateThrottle(e);
            }
        }, { passive: false });

        document.addEventListener('touchend', () => {
            throttleDrag = false;
        });

        throttleHandle.addEventListener('mousedown', (e) => {
            throttleDrag = true;
            updateThrottle(e);
        });

        document.addEventListener('mousemove', (e) => {
            if (throttleDrag) updateThrottle(e);
        });

        document.addEventListener('mouseup', () => {
            throttleDrag = false;
        });

        // ================================================================
        // 15. EVENTOS DE BOTONES
        // ================================================================
        document.getElementById('btn-spray').addEventListener('click', toggleSpray);
        document.getElementById('btn-flaps').addEventListener('click', toggleFlaps);
        document.getElementById('btn-brake').addEventListener('click', toggleBrake);
        document.getElementById('btn-rescue').addEventListener('click', rescuePlane);
        document.getElementById('btn-save').addEventListener('click', guardarPartida);
        document.getElementById('btn-pause').addEventListener('click', togglePause);
        document.getElementById('btn-resume').addEventListener('click', togglePause);
        document.getElementById('btn-save-menu').addEventListener('click', () => { guardarPartida(); togglePause(); });
        document.getElementById('btn-load-menu').addEventListener('click', () => { cargarPartida(); togglePause(); });
        document.getElementById('btn-quit').addEventListener('click', () => {
            if (confirm('¿Seguro que quieres salir?')) {
                guardarPartida();
                document.getElementById('pause-menu').style.display = 'none';
                mostrarAlerta('👋 ¡Hasta luego!', 'info');
            }
        });
        document.getElementById('btn-restart').addEventListener('click', () => {
            if (confirm('¿Reiniciar partida? Se perderá el progreso actual.')) {
                localStorage.removeItem('agroflight_save');
                location.reload();
            }
        });

        document.getElementById('btn-cam').addEventListener('click', () => {
            cameraMode = (cameraMode + 1) % 3;
            const modos = ['EXTERNA', 'CABINA', 'PANORÁMICA'];
            mostrarAlerta(`📷 CÁMARA: ${modos[cameraMode]}`, 'info');
        });

        // ================================================================
        // 16. TECLADO
        // ================================================================
        document.addEventListener('keydown', (e) => {
            switch (e.key.toLowerCase()) {
                case 'w':
                    throttleTarget = Math.min(100, throttleTarget + 10);
                    e.preventDefault();
                    break;
                case 's':
                    throttleTarget = Math.max(0, throttleTarget - 10);
                    e.preventDefault();
                    break;
                case 'arrowup':
                    joyY = 1;
                    e.preventDefault();
                    break;
                case 'arrowdown':
                    joyY = -1;
                    e.preventDefault();
                    break;
                case 'arrowleft':
                    joyX = -1;
                    e.preventDefault();
                    break;
                case 'arrowright':
                    joyX = 1;
                    e.preventDefault();
                    break;
                case ' ':
                    toggleSpray();
                    e.preventDefault();
                    break;
                case 'q':
                    toggleFlaps();
                    e.preventDefault();
                    break;
                case 'f':
                    toggleBrake();
                    e.preventDefault();
                    break;
                case 'c':
                    document.getElementById('btn-cam').click();
                    e.preventDefault();
                    break;
                case 'r':
                    rescuePlane();
                    e.preventDefault();
                    break;
                case 'escape':
                    togglePause();
                    e.preventDefault();
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.key.toLowerCase()) {
                case 'arrowup':
                case 'arrowdown':
                    joyY = 0;
                    break;
                case 'arrowleft':
                case 'arrowright':
                    joyX = 0;
                    break;
            }
        });

        // ================================================================
        // 17. CÁMARA
        // ================================================================
        function updateCamera() {
            const pos = airplane.position;
            switch (cameraMode) {
                case 0: // Externa
                    const offset = new THREE.Vector3(0, 8, 25).applyQuaternion(airplane.quaternion);
                    camera.position.copy(pos).add(offset);
                    camera.lookAt(pos.clone().add(new THREE.Vector3(0, 2, -15).applyQuaternion(airplane.quaternion)));
                    break;
                case 1: // Cabina
                    const cabinPos = pos.clone().add(new THREE.Vector3(0, 2.8, 0.5).applyQuaternion(airplane.quaternion));
                    camera.position.copy(cabinPos);
                    camera.lookAt(pos.clone().add(new THREE.Vector3(0, 2.5, -30).applyQuaternion(airplane.quaternion)));
                    break;
                case 2: // Panorámica
                    const dist = 40 + speed * 0.1;
                    const angle = Date.now() * 0.0001;
                    camera.position.set(
                        pos.x + Math.sin(angle) * dist,
                        pos.y + 15 + Math.sin(angle * 0.5) * 5,
                        pos.z + Math.cos(angle) * dist
                    );
                    camera.lookAt(pos);
                    break;
            }
        }

        // ================================================================
        // 18. BUCLE PRINCIPAL
        // ================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);

            if (document.getElementById('pause-menu').style.display !== 'flex') {
                updatePhysics(delta);
                updateCamera();
            }

            renderer.render(scene, camera);
        }

        // ================================================================
        // 19. RESPONSIVE
        // ================================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ================================================================
        // 20. INICIO
        // ================================================================
        // Detectar orientación
        if (window.innerWidth < 768) {
            document.getElementById('joystick-container').style.display = 'block';
            document.getElementById('artificial-horizon').style.display = 'block';
            document.getElementById('minimap').style.display = 'block';
            // Activar giroscopio en móvil
            initGyro();
        }

        // Mostrar panel de preparación
        setTimeout(() => {
            document.getElementById('panel-preparacion').style.display = 'block';
            mostrarAlerta('🚜 BIENVENIDO PILOTO - PREPARA TU AVION', 'info');
        }, 500);

        // Cargar partida automática
        setTimeout(cargarPartida, 1000);

        // Iniciar simulación
        animate();
    </script>
</body>
</html>
