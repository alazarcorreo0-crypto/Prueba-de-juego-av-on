<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroFlight 3D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #87ceeb;
            color: #fff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* HUD */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
        }
        .hud-row {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .hud-val {
            font-weight: bold;
            font-family: monospace;
        }
        .hud-val.alt { color: #38bdf8; }
        .hud-val.spd { color: #facc15; }
        .hud-val.pwr { color: #f97316; }

        .tank-bar-outer {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        .tank-bar-inner {
            width: 100%;
            height: 100%;
            background: #10b981;
            transition: width 0.1s linear;
        }

        /* BANNER ASPERSIÓN */
        #spray-status {
            position: absolute;
            top: 12px;
            right: 10px;
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 10;
        }
        #spray-status.active {
            opacity: 1;
            background: #10b981;
            color: #064e3b;
        }

        /* CONTROLES TÁCTILES */
        .touch-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            z-index: 20;
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }

        /* D-PAD */
        #dpad-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 140px;
            height: 140px;
            z-index: 20;
        }
        #btn-up { top: 0; left: 45px; width: 50px; height: 50px; }
        #btn-down { bottom: 0; left: 45px; width: 50px; height: 50px; }
        #btn-left { top: 45px; left: 0; width: 50px; height: 50px; }
        #btn-right { top: 45px; right: 0; width: 50px; height: 50px; }

        /* POTENCIA Y ASPERSIÓN */
        #btn-pwr-up {
            bottom: 120px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: rgba(249, 115, 22, 0.4);
            border-color: rgba(249, 115, 22, 0.8);
        }
        #btn-pwr-down {
            bottom: 55px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: rgba(249, 115, 22, 0.4);
            border-color: rgba(249, 115, 22, 0.8);
        }
        #btn-spray {
            bottom: 55px;
            right: 90px;
            width: 65px;
            height: 65px;
            border-radius: 18px;
            background: rgba(16, 185, 129, 0.4);
            border-color: rgba(16, 185, 129, 0.8);
            font-size: 11px;
            text-align: center;
        }
        #btn-cam {
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 16px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 20;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-row"><span>ALT:</span> <span class="hud-val alt" id="val-alt">0m</span></div>
        <div class="hud-row"><span>VEL:</span> <span class="hud-val spd" id="val-spd">0 km/h</span></div>
        <div class="hud-row"><span>POT:</span> <span class="hud-val pwr" id="val-pwr">0%</span></div>
        <div class="tank-bar-outer"><div class="tank-bar-inner" id="bar-tank"></div></div>
    </div>

    <div id="spray-status">ASPERSION</div>
    <div id="btn-cam">CAMARA</div>

    <!-- D-PAD -->
    <div id="dpad-container">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
    </div>

    <!-- POTENCIA Y SPRAY -->
    <div class="touch-btn" id="btn-pwr-up">+ W</div>
    <div class="touch-btn" id="btn-pwr-down">- S</div>
    <div class="touch-btn" id="btn-spray">SPRAY</div>

    <script>
        // --- 1. CONFIGURACIÓN BASE ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. ILUMINACIÓN ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(100, 200, 100);
        scene.add(dirLight);

        // --- 3. TERRENO Y PARCELAS ---
        const groundGeo = new THREE.PlaneGeometry(3000, 3000);
        const groundMat = new THREE.MeshBasicMaterial({ color: 0x4a7c20 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Pista
        const runwayGeo = new THREE.PlaneGeometry(30, 400);
        const runwayMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const runway = new THREE.Mesh(runwayGeo, runwayMat);
        runway.rotation.x = -Math.PI / 2;
        runway.position.set(0, 0.1, -100);
        scene.add(runway);

        // Parcelas
        const cropColors = [0x2e7d32, 0x388e3c, 0x558b2f, 0x827717];
        for(let x = -800; x <= 800; x += 350) {
            for(let z = -800; z <= 800; z += 350) {
                if(Math.abs(x) < 200 && Math.abs(z) < 300) continue;
                const cropGeo = new THREE.PlaneGeometry(300, 300);
                const color = cropColors[Math.floor(Math.random() * cropColors.length)];
                const cropField = new THREE.Mesh(cropGeo, new THREE.MeshBasicMaterial({ color: color }));
                cropField.rotation.x = -Math.PI / 2;
                cropField.position.set(x, 0.15, z);
                scene.add(cropField);
            }
        }

        // --- 4. AVIÓN ---
        const airplane = new THREE.Group();
        const yellowMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
        const blueMat = new THREE.MeshBasicMaterial({ color: 0x1d4ed8 });
        const darkMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
        const glassMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.8, 7), yellowMat);
        body.position.y = 1.2;
        airplane.add(body);

        const nose = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 2), blueMat);
        nose.position.set(0, 1.1, -4);
        airplane.add(nose);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.2, 2), glassMat);
        cabin.position.set(0, 2.2, 0.5);
        airplane.add(cabin);

        const wing = new THREE.Mesh(new THREE.BoxGeometry(14, 0.15, 2.2), yellowMat);
        wing.position.set(0, 1.2, -0.8);
        airplane.add(wing);

        const sprayBar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 13.5), darkMat);
        sprayBar.rotation.z = Math.PI / 2;
        sprayBar.position.set(0, 0.8, -0.1);
        airplane.add(sprayBar);

        const propGroup = new THREE.Group();
        const propHub = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.5), darkMat);
        propHub.rotation.x = Math.PI / 2;
        propGroup.add(propHub);
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.8, 0.05), darkMat);
        propGroup.add(blade);
        propGroup.position.set(0, 1.1, -5.1);
        airplane.add(propGroup);

        airplane.position.set(0, 0, 80);
        scene.add(airplane);

        // --- 5. PARTICULAS ASPERSIÓN ---
        const particleCount = 300;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

        const particleMat = new THREE.PointsMaterial({
            color: 0x00ffff, size: 2.0, transparent: true, opacity: 0.8
        });
        const sprayParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(sprayParticles);
        let particleIndex = 0;

        function emitSpray() {
            if (!isSpraying || tankLevel <= 0) return;
            const pos = sprayParticles.geometry.attributes.position.array;
            for (let i = -6; i <= 6; i += 2) {
                const pt = new THREE.Vector3(i, 0.8, -0.1).applyMatrix4(airplane.matrixWorld);
                pos[particleIndex * 3] = pt.x + (Math.random() - 0.5) * 0.3;
                pos[particleIndex * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.3;
                pos[particleIndex * 3 + 2] = pt.z + (Math.random() - 0.5) * 0.3;
                particleIndex = (particleIndex + 1) % particleCount;
            }
            sprayParticles.geometry.attributes.position.needsUpdate = true;
        }

        // --- 6. CONTROLES Y FÍSICAS ---
        let throttle = 0, speed = 0, pitch = 0, roll = 0, yaw = 0;
        let isSpraying = false, tankLevel = 100, cameraMode = 0;
        const touchState = { up: false, down: false, left: false, right: false, pwrUp: false, pwrDown: false };

        function bindTouch(id, key) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); touchState[key] = true; };
            const end = (e) => { e.preventDefault(); touchState[key] = false; };
            el.addEventListener('touchstart', start, {passive: false});
            el.addEventListener('touchend', end, {passive: false});
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        }

        bindTouch('btn-up', 'up');
        bindTouch('btn-down', 'down');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-pwr-up', 'pwrUp');
        bindTouch('btn-pwr-down', 'pwrDown');

        document.getElementById('btn-spray').addEventListener('touchstart', (e) => {
            e.preventDefault();
            toggleSpray();
        }, {passive: false});
        document.getElementById('btn-spray').addEventListener('click', toggleSpray);

        function toggleSpray() {
            isSpraying = !isSpraying;
            const statusElem = document.getElementById('spray-status');
            if (isSpraying && tankLevel > 0) statusElem.classList.add('active');
            else statusElem.classList.remove('active');
        }

        document.getElementById('btn-cam').addEventListener('click', () => { cameraMode = (cameraMode + 1) % 2; });

        const clock = new THREE.Clock();

        function updatePhysics(delta) {
            if (touchState.pwrUp) throttle = Math.min(100, throttle + 40 * delta);
            if (touchState.pwrDown) throttle = Math.max(0, throttle - 50 * delta);

            const targetSpeed = (throttle / 100) * 120;
            speed += (targetSpeed - speed) * 1.8 * delta;
            propGroup.rotation.z += (speed + 5) * delta * 0.5;

            const ctrl = Math.min(1.0, speed / 30);
            if (touchState.up) pitch = Math.min(0.6, pitch + 1.5 * delta * ctrl);
            else if (touchState.down) pitch = Math.max(-0.6, pitch - 1.5 * delta * ctrl);
            else pitch *= 0.90;

            if (touchState.left) roll = Math.min(0.8, roll + 2.2 * delta * ctrl);
            else if (touchState.right) roll = Math.max(-0.8, roll - 2.2 * delta * ctrl);
            else roll *= 0.88;

            airplane.rotation.z = -roll;
            airplane.rotation.x = pitch;
            yaw -= roll * 1.0 * delta * ctrl;
            airplane.rotation.y = yaw;

            airplane.translateOnAxis(new THREE.Vector3(0, 0, -1), (speed / 3.6) * delta);
            if (airplane.position.y < 0.2) airplane.position.y = 0.2;

            if (isSpraying && tankLevel > 0) {
                tankLevel = Math.max(0, tankLevel - 5.0 * delta);
                emitSpray();
                if (tankLevel <= 0) document.getElementById('spray-status').classList.remove('active');
            }

            document.getElementById('val-alt').textContent = Math.round(airplane.position.y) + 'm';
            document.getElementById('val-spd').textContent = Math.round(speed) + ' km/h';
            document.getElementById('val-pwr').textContent = Math.round(throttle) + '%';
            document.getElementById('bar-tank').style.width = tankLevel + '%';
        }

        function updateCamera() {
            if (cameraMode === 0) {
                const offset = new THREE.Vector3(0, 5, 18).applyQuaternion(airplane.quaternion);
                camera.position.copy(airplane.position).add(offset);
                camera.lookAt(airplane.position.clone().add(new THREE.Vector3(0, 2, -10).applyQuaternion(airplane.quaternion)));
            } else {
                const cabinPos = airplane.position.clone().add(new THREE.Vector3(0, 2.3, 0.2).applyQuaternion(airplane.quaternion));
                camera.position.copy(cabinPos);
                camera.lookAt(airplane.position.clone().add(new THREE.Vector3(0, 2.0, -20).applyQuaternion(airplane.quaternion)));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            updatePhysics(delta);
            updateCamera();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
