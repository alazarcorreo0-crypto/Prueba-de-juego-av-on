<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación Despacho - Exacto</title>
    <style>
        /* --- RESET Y FUENTES --- */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .app-container {
            width: 100%;
            max-width: 1200px; /* Ancho para que quepan las 3 columnas */
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* --- BARRA SUPERIOR --- */
        .top-bar {
            background-color: #ffffff;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            color: #666;
        }

        .search-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0 10px;
            height: 34px;
        }

        .search-container span {
            margin-right: 8px;
            color: #999;
            font-size: 16px;
        }

        .search-input {
            flex-grow: 1;
            border: none;
            background: transparent;
            font-size: 13px;
            outline: none;
            height: 100%;
        }

        .btn-approve {
            background-color: #1a9c6e; /* Verde oscuro de la foto */
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        /* --- LISTA DE CAMIONES --- */
        .truck-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            background-color: #e9ecef;
            height: 85vh;
            overflow-y: auto;
        }

        /* --- TARJETA INDIVIDUAL --- */
        .truck-card {
            display: flex;
            background-color: #ffffff;
            border: 1px solid #ddd;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow: hidden;
            position: relative;
        }

        /* --- PANEL IZQUIERDO (AZUL OSCURO) --- */
        .left-panel {
            width: 130px;
            background-color: #1a2b3c; /* Azul oscuro exacto */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .ticket-number {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .truck-id {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .loads-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .loads-value {
            font-size: 18px;
            font-weight: 700;
        }

        /* --- PANEL DERECHO (DATOS) --- */
        .right-panel {
            flex-grow: 1;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- CABECERA DE LA TARJETA --- */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 12px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .date-row {
            display: flex;
            gap: 15px;
            font-weight: 600;
            color: #333;
        }

        .time-row {
            display: flex;
            gap: 10px;
            color: #555;
            font-size: 11px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 2px;
        }

        .badge-potatoes {
            background-color: #c49a45; /* Color mostaza de la foto */
            color: #ffffff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* --- BOTÓN DE IMPRESORA --- */
        .btn-print-icon {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #444;
            padding: 0 5px;
            transition: color 0.2s;
        }

        .btn-print-icon:hover {
            color: #000;
        }

        /* --- BOTÓN CANCEL APPROVAL --- */
        .btn-cancel {
            background-color: #c93b4b; /* Rojo de la foto */
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            line-height: 1.2;
            white-space: nowrap;
        }

        .btn-cancel:hover {
            background-color: #a32e3c;
        }

        /* --- CUERPO DE DATOS (3 COLUMNAS) --- */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; /* 3 columnas exactas */
            gap: 15px 20px;
            font-size: 13px;
        }

        .data-field {
            display: flex;
            flex-direction: column;
        }

        .data-field label {
            font-size: 11px;
            color: #666;
            margin-bottom: 3px;
            font-weight: 400;
        }

        .data-field .value {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
            min-height: 24px;
        }

        /* --- MENSAJE DE ALERTA (Para el botón de imprimir) --- */
        .alert-message {
            display: none;
            background-color: #fee2e2;
            color: #991b1b;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #fecaca;
            margin-top: 5px;
        }

        /* --- SCROLLBAR --- */
        .truck-list::-webkit-scrollbar {
            width: 8px;
        }
        .truck-list::-webkit-scrollbar-track {
            background: #e9ecef;
        }
        .truck-list::-webkit-scrollbar-thumb {
            background: #adb5bd;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Barra superior -->
    <div class="top-bar">
        <div class="search-container">
            <span>🔍</span>
            <input type="text" class="search-input" placeholder="Search for Crew, EG, Crop, Ticket Number">
        </div>
        <button class="btn-approve">Approve</button>
    </div>

    <!-- Lista de Camiones -->
    <div class="truck-list" id="truckList">
        <!-- Se genera con JavaScript -->
    </div>
</div>

<script>
    // 1. DATOS EXACTOS DE LA FOTO
    const trucksData = [
        { ticket: "3910", truckId: "R-20", loads: 1, date: "19 Sep", year: "2026", timeStart: "09:47:23 AM", timeEnd: "10:15:28 AM", implement: "GS Digger 24", field: "0083", offload: "N/A", storage: "N/A", netWeight: 35420, grossWeight: 57600, lightWeight: 22180 },
        { ticket: "3907", truckId: "R-19", loads: 1, date: "19 Sep", year: "2026", timeStart: "09:37:43 AM", timeEnd: "10:09:31 AM", implement: "GS Digger 19", field: "0083", offload: "N/A", storage: "N/A", netWeight: 35840, grossWeight: 57460, lightWeight: 21620 },
        { ticket: "3906", truckId: "R-13", loads: 1, date: "19 Sep", year: "2026", timeStart: "09:47:56 AM", timeEnd: "10:09:20 AM", implement: "GS Digger 14", field: "0032", offload: "N/A", storage: "N/A", netWeight: 35200, grossWeight: 57460, lightWeight: 22260 },
        { ticket: "3905", truckId: "106", loads: 1, date: "19 Sep", year: "2026", timeStart: "09:50:27 AM", timeEnd: "10:07:31 AM", implement: "GS Digger 17", field: "0032", offload: "N/A", storage: "N/A", netWeight: 34900, grossWeight: 57960, lightWeight: 23060 }
    ];

    const truckListContainer = document.getElementById('truckList');

    // 2. FUNCIÓN PARA RENDERIZAR LAS TARJETAS
    function renderTrucks() {
        truckListContainer.innerHTML = '';

        trucksData.forEach((truck, index) => {
            const cardWrapper = document.createElement('div');
            cardWrapper.className = 'truck-card';

            // Generamos el HTML exacto
            cardWrapper.innerHTML = `
                <!-- Panel Izquierdo Azul Oscuro -->
                <div class="left-panel">
                    <div class="ticket-number">${truck.ticket}</div>
                    <div class="truck-id">${truck.truckId}</div>
                    <div class="loads-label">LOADS</div>
                    <div class="loads-value">${truck.loads}</div>
                </div>

                <!-- Panel Derecho de Datos -->
                <div class="right-panel">
                    <!-- Cabecera -->
                    <div class="card-header">
                        <div class="header-left">
                            <div class="date-row">
                                <span>${truck.date}</span>
                                <span>${truck.year}</span>
                            </div>
                            <div class="time-row">
                                <span>${truck.timeStart}</span>
                                <span>-</span>
                                <span>${truck.timeEnd}</span>
                            </div>
                        </div>
                        <div class="header-right">
                            <span class="badge-potatoes">Potatoes</span>
                            <button class="btn-print-icon" data-index="${index}" title="Imprimir">🖨️</button>
                            <button class="btn-cancel">Cancel<br>Approval</button>
                        </div>
                    </div>

                    <!-- Cuerpo de datos (3 columnas) -->
                    <div class="data-grid">
                        <!-- Fila 1 -->
                        <div class="data-field">
                            <label>Implement</label>
                            <div class="value">${truck.implement}</div>
                        </div>
                        <div class="data-field">
                            <label>Field</label>
                            <div class="value">${truck.field}</div>
                        </div>
                        <div class="data-field">
                            <label>Offload Site</label>
                            <div class="value">${truck.offload}</div>
                        </div>
                        
                        <!-- Fila 2 -->
                        <div class="data-field">
                            <label>Storage</label>
                            <div class="value">${truck.storage}</div>
                        </div>
                        <div class="data-field">
                            <label>Net Weight (lbs)</label>
                            <div class="value">${truck.netWeight}</div>
                        </div>
                        <div class="data-field">
                            <label>Gross Weight (lbs)</label>
                            <div class="value">${truck.grossWeight}</div>
                        </div>

                        <!-- Fila 3 (Light Weight ocupa solo la primera columna, como en la foto) -->
                        <div class="data-field">
                            <label>Light Weight (lbs)</label>
                            <div class="value">${truck.lightWeight}</div>
                        </div>
                    </div>

                    <!-- Alerta de error oculta -->
                    <div class="alert-message" id="alert-${index}">⚠️ Error: El peso neto debe ser mayor a 50 lbs para imprimir.</div>
                </div>
            `;

            truckListContainer.appendChild(cardWrapper);
        });

        attachEvents();
    }

    // 3. LÓGICA DE EVENTOS
    function attachEvents() {
        // Evento para el botón de la impresora
        document.querySelectorAll('.btn-print-icon').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const index = this.dataset.index;
                processPrint(index, this);
            });
        });

        // Evento para el botón Cancel Approval (simulado)
        document.querySelectorAll('.btn-cancel').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                alert("Cancelando aprobación...");
            });
        });
    }

    // 4. FUNCIÓN DE IMPRESIÓN (Validación y simulación)
    function processPrint(index, btnElement) {
        const truck = trucksData[index];
        const alertBox = document.getElementById(`alert-${index}`);
        const netWeight = truck.netWeight || 0;

        // Validación: Si el Net Weight es menor a 50, no imprime
        if (netWeight < 50) {
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3000);
            return;
        }

        alertBox.style.display = 'none';

        // Simular impresión directa
        if (btnElement) {
            const originalIcon = btnElement.innerHTML;
            btnElement.innerHTML = '⏳';
            btnElement.style.color = '#6b7280';
            
            setTimeout(() => {
                btnElement.innerHTML = '✔';
                btnElement.style.color = '#10b981';
                
                setTimeout(() => {
                    btnElement.innerHTML = originalIcon;
                    btnElement.style.color = '#444';
                }, 2000);
            }, 800);
        }

        console.log(`✅ Imprimiendo ticket ${truck.ticket} - Net Weight: ${netWeight}`);
    }

    // Iniciar
    renderTrucks();
</script>

</body>
</html>
