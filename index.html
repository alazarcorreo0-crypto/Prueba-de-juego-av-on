<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgroFlight 3D Pro - Nivel 2</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #87ceeb;
            color: #fff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* HUD MEJORADO */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            min-width: 170px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .hud-val {
            font-weight: bold;
            font-family: monospace;
            font-size: 12px;
        }
        .hud-val.alt { color: #38bdf8; }
        .hud-val.spd { color: #facc15; }
        .hud-val.pwr { color: #f97316; }
        .hud-val.cov { color: #4ade80; }

        .tank-bar-outer {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }
        .tank-bar-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #06b6d4);
            transition: width 0.1s linear;
        }

        /* ALERTAS EN PANTALLA */
        #alert-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 15;
            text-align: center;
        }
        #alert-banner.spray {
            opacity: 1;
            background: rgba(16, 185, 129, 0.9);
            color: #064e3b;
        }
        #alert-banner.warn {
            opacity: 1;
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* CONTROLES TÁCTILES */
        .touch-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            z-index: 20;
            backdrop-filter: blur(4px);
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }

        #dpad-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 140px;
            height: 140px;
            z-index: 20;
        }
        #btn-up { top: 0; left: 45px; width: 50px; height: 50px; }
        #btn-down { bottom: 0; left: 45px; width: 50px; height: 50px; }
        #btn-left { top: 45px; left: 0; width: 50px; height: 50px; }
        #btn-right { top: 45px; right: 0; width: 50px; height: 50px; }

        #btn-pwr-up {
            bottom: 120px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: rgba(249, 115, 22, 0.4);
            border-color: rgba(249, 115, 22, 0.8);
        }
        #btn-pwr-down {
            bottom: 55px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: rgba(249, 115, 22, 0.4);
            border-color: rgba(249, 115, 22, 0.8);
        }
        #btn-spray {
            bottom: 55px;
            right: 90px;
            width: 65px;
            height: 65px;
            border-radius: 18px;
            background: rgba(16, 185, 129, 0.4);
            border-color: rgba(16, 185, 129, 0.8);
            font-size: 11px;
            text-align: center;
        }
        #btn-cam {
            top: 10px;
            right: 10px;
            padding: 8px 16px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 20;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-row"><span>ALTITUD:</span> <span class="hud-val alt" id="val-alt">0m</span></div>
        <div class="hud-row"><span>VELOCIDAD:</span> <span class="hud-val spd" id="val-spd">0 km/h</span></div>
        <div class="hud-row"><span>POTENCIA:</span> <span class="hud-val pwr" id="val-pwr">0%</span></div>
        <div class="hud-row"><span>MARCADO:</span> <span class="hud-val cov" id="val-cov">0 ha</span></div>
        <div class="tank-bar-outer"><div class="tank-bar-inner" id="bar-tank"></div></div>
    </div>

    <div id="alert-banner">ASPERSION ACTIVA</div>
    <div id="btn-cam">CAMARA</div>

    <!-- CONTROLES -->
    <div id="dpad-container">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
    </div>

    <div class="touch-btn" id="btn-pwr-up">+ W</div>
    <div class="touch-btn" id="btn-pwr-down">- S</div>
    <div class="touch-btn" id="btn-spray">SPRAY</div>

    <script>
        // --- 1. CONFIGURACIÓN BASE ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.001);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. ILUMINACIÓN ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.6);
        dirLight.position.set(200, 400, 200);
        scene.add(dirLight);

        // --- 3. TERRENO BASE ---
        const groundGeo = new THREE.PlaneGeometry(3000, 3000);
        const groundMat = new THREE.MeshBasicMaterial({ color: 0x4a7c20 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Pista de Aterrizaje
        const runwayGeo = new THREE.PlaneGeometry(30, 400);
        const runwayMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
        const runway = new THREE.Mesh(runwayGeo, runwayMat);
        runway.rotation.x = -Math.PI / 2;
        runway.position.set(0, 0.1, -100);
        scene.add(runway);

        // Parcelas
        const cropColors = [0x2e7d32, 0x388e3c, 0x558b2f, 0x827717];
        for(let x = -800; x <= 800; x += 350) {
            for(let z = -800; z <= 800; z += 350) {
                if(Math.abs(x) < 200 && Math.abs(z) < 300) continue;
                const cropGeo = new THREE.PlaneGeometry(300, 300);
                const color = cropColors[Math.floor(Math.random() * cropColors.length)];
                const cropField = new THREE.Mesh(cropGeo, new THREE.MeshBasicMaterial({ color: color }));
                cropField.rotation.x = -Math.PI / 2;
                cropField.position.set(x, 0.15, z);
                scene.add(cropField);
            }
        }

        // --- 4. OBSTÁCULOS (LÍNEAS DE ALTA TENSIÓN Y ÁRBOLES) ---
        const obstacles = [];
        const poleMat = new THREE.MeshBasicMaterial({ color: 0x475569 });
        const wireMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const treeTrunkMat = new THREE.MeshBasicMaterial({ color: 0x5c3d11 });
        const treeLeavesMat = new THREE.MeshBasicMaterial({ color: 0x1b4332 });

        function createPowerLineZone(startZ, endZ, posX) {
            let prevPolePos = null;
            for(let z = startZ; z <= endZ; z += 120) {
                const poleGroup = new THREE.Group();
                
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 18), poleMat);
                pole.position.y = 9;
                poleGroup.add(pole);

                const cross = new THREE.Mesh(new THREE.BoxGeometry(6, 0.3, 0.3), poleMat);
                cross.position.y = 17;
                poleGroup.add(cross);

                poleGroup.position.set(posX, 0, z);
                scene.add(poleGroup);
                obstacles.push({ x: posX, y: 9, z: z, radius: 3, height: 18, type: 'poste' });

                if(prevPolePos) {
                    const wireGeo = new THREE.CylinderGeometry(0.05, 0.05, 120);
                    const wire = new THREE.Mesh(wireGeo, wireMat);
                    wire.position.set(posX, 17, z - 60);
                    wire.rotation.x = Math.PI / 2;
                    scene.add(wire);
                }
                prevPolePos = { x: posX, y: 17, z: z };
            }
        }

        createPowerLineZone(-600, 600, 160);
        createPowerLineZone(-600, 600, -160);

        for(let i = 0; i < 60; i++) {
            const tx = (Math.random() - 0.5) * 1600;
            const tz = (Math.random() - 0.5) * 1600;
            if(Math.abs(tx) < 180 && Math.abs(tz) < 300) continue;

            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 6), treeTrunkMat);
            trunk.position.y = 3;
            tree.add(trunk);

            const leaves = new THREE.Mesh(new THREE.ConeGeometry(5, 14, 6), treeLeavesMat);
            leaves.position.y = 10;
            tree.add(leaves);

            tree.position.set(tx, 0, tz);
            scene.add(tree);
            obstacles.push({ x: tx, y: 7, z: tz, radius: 4, height: 14, type: 'arbol' });
        }

        // --- 5. AVIÓN AIR TRACTOR ---
        const airplane = new THREE.Group();
        const yellowMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
        const blueMat = new THREE.MeshBasicMaterial({ color: 0x1d4ed8 });
        const darkMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
        const glassMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.8, 7), yellowMat);
        body.position.y = 1.2;
        airplane.add(body);

        const nose = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 2), blueMat);
        nose.position.set(0, 1.1, -4);
        airplane.add(nose);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.2, 2), glassMat);
        cabin.position.set(0, 2.2, 0.5);
        airplane.add(cabin);

        const wing = new THREE.Mesh(new THREE.BoxGeometry(14, 0.15, 2.2), yellowMat);
        wing.position.set(0, 1.2, -0.8);
        airplane.add(wing);

        const sprayBar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 13.5), darkMat);
        sprayBar.rotation.z = Math.PI / 2;
        sprayBar.position.set(0, 0.8, -0.1);
        airplane.add(sprayBar);

        const propGroup = new THREE.Group();
        const propHub = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.5), darkMat);
        propHub.rotation.x = Math.PI / 2;
        propGroup.add(propHub);
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.8, 0.05), darkMat);
        propGroup.add(blade);
        propGroup.position.set(0, 1.1, -5.1);
        airplane.add(propGroup);

        airplane.position.set(0, 0, 80);
        scene.add(airplane);

        // --- 6. SWATH PAINTING Y PARTICULAS ---
        const sprayedTracks = [];
        const trackMat = new THREE.MeshBasicMaterial({ color: 0x1b4332, transparent: true, opacity: 0.7 });
        let areaCoveredSqm = 0;

        function paintSwathSegment() {
            if (airplane.position.y > 8) return;

            const trackGeo = new THREE.PlaneGeometry(13.5, 3);
            const trackMesh = new THREE.Mesh(trackGeo, trackMat);
            trackMesh.rotation.x = -Math.PI / 2;
            trackMesh.rotation.z = airplane.rotation.y;
            trackMesh.position.set(airplane.position.x, 0.2, airplane.position.z);
            scene.add(trackMesh);

            sprayedTracks.push(trackMesh);
            areaCoveredSqm += (13.5 * 3);
        }

        const particleCount = 300;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

        const particleMat = new THREE.PointsMaterial({
            color: 0x00ffff, size: 2.2, transparent: true, opacity: 0.8
        });
        const sprayParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(sprayParticles);
        let particleIndex = 0;

        function emitSpray() {
            if (!isSpraying || tankLevel <= 0) return;
            const pos = sprayParticles.geometry.attributes.position.array;
            for (let i = -6; i <= 6; i += 2) {
                const pt = new THREE.Vector3(i, 0.8, -0.1).applyMatrix4(airplane.matrixWorld);
                pos[particleIndex * 3] = pt.x + (Math.random() - 0.5) * 0.3;
                pos[particleIndex * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.3;
                pos[particleIndex * 3 + 2] = pt.z + (Math.random() - 0.5) * 0.3;
                particleIndex = (particleIndex + 1) % particleCount;
            }
            sprayParticles.geometry.attributes.position.needsUpdate = true;
            paintSwathSegment();
        }

        // --- 7. CONTROLES Y FÍSICAS ---
        let throttle = 0, speed = 0, pitch = 0, roll = 0, yaw = 0;
        let isSpraying = false, tankLevel = 100, cameraMode = 0;
        const touchState = { up: false, down: false, left: false, right: false, pwrUp: false, pwrDown: false };

        function bindTouch(id, key) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); touchState[key] = true; };
            const end = (e) => { e.preventDefault(); touchState[key] = false; };
            el.addEventListener('touchstart', start, {passive: false});
            el.addEventListener('touchend', end, {passive: false});
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        }

        bindTouch('btn-up', 'up');
        bindTouch('btn-down', 'down');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-pwr-up', 'pwrUp');
        bindTouch('btn-pwr-down', 'pwrDown');

        document.getElementById('btn-spray').addEventListener('touchstart', (e) => {
            e.preventDefault();
            toggleSpray();
        }, {passive: false});
        document.getElementById('btn-spray').addEventListener('click', toggleSpray);

        function toggleSpray() {
            isSpraying = !isSpraying;
            const statusElem = document.getElementById('alert-banner');
            if (isSpraying && tankLevel > 0) {
                statusElem.className = 'spray';
                statusElem.textContent = 'ASPERSION ACTIVA';
            } else {
                statusElem.className = '';
            }
        }

        document.getElementById('btn-cam').addEventListener('click', () => { cameraMode = (cameraMode + 1) % 2; });

        function checkCollisions() {
            const planePos = airplane.position;
            const banner = document.getElementById('alert-banner');

            for(let obs of obstacles) {
                const dist = Math.sqrt(Math.pow(planePos.x - obs.x, 2) + Math.pow(planePos.z - obs.z, 2));
                if(dist < obs.radius + 2 && planePos.y < obs.height) {
                    banner.className = 'warn';
                    banner.textContent = '¡PELIGRO: ALTA TENSIÓN / ÁRBOLES!';
                    return;
                }
            }
            if(!isSpraying) banner.className = '';
        }

        const clock = new THREE.Clock();

        function updatePhysics(delta) {
            const weightFactor = 0.7 + (tankLevel / 100) * 0.5;

            if (touchState.pwrUp) throttle = Math.min(100, throttle + (40 / weightFactor) * delta);
            if (touchState.pwrDown) throttle = Math.max(0, throttle - 50 * delta);

            const targetSpeed = (throttle / 100) * 130;
            speed += (targetSpeed - speed) * (1.8 / weightFactor) * delta;
            propGroup.rotation.z += (speed + 5) * delta * 0.5;

            const ctrl = Math.min(1.0, speed / (35 * weightFactor));
            if (touchState.up) pitch = Math.min(0.6, pitch + (1.5 / weightFactor) * delta * ctrl);
            else if (touchState.down) pitch = Math.max(-0.6, pitch - (1.5 / weightFactor) * delta * ctrl);
            else pitch *= 0.90;

            if (touchState.left) roll = Math.min(0.8, roll + (2.2 / weightFactor) * delta * ctrl);
            else if (touchState.right) roll = Math.max(-0.8, roll - (2.2 / weightFactor) * delta * ctrl);
            else roll *= 0.88;

            airplane.rotation.z = -roll;
            airplane.rotation.x = pitch;
            yaw -= roll * 1.0 * delta * ctrl;
            airplane.rotation.y = yaw;

            airplane.translateOnAxis(new THREE.Vector3(0, 0, -1), (speed / 3.6) * delta);
            if (airplane.position.y < 0.2) airplane.position.y = 0.2;

            if (isSpraying && tankLevel > 0) {
                tankLevel = Math.max(0, tankLevel - 4.5 * delta);
                emitSpray();
                if (tankLevel <= 0) document.getElementById('alert-banner').className = '';
            }

            checkCollisions();

            document.getElementById('val-alt').textContent = Math.round(airplane.position.y) + 'm';
            document.getElementById('val-spd').textContent = Math.round(speed) + ' km/h';
            document.getElementById('val-pwr').textContent = Math.round(throttle) + '%';
            document.getElementById('val-cov').textContent = (areaCoveredSqm / 10000).toFixed(2) + ' ha';
            document.getElementById('bar-tank').style.width = tankLevel + '%';
        }

        function updateCamera() {
            if (cameraMode === 0) {
                const offset = new THREE.Vector3(0, 5, 18).applyQuaternion(airplane.quaternion);
                camera.position.copy(airplane.position).add(offset);
                camera.lookAt(airplane.position.clone().add(new THREE.Vector3(0, 2, -10).applyQuaternion(airplane.quaternion)));
            } else {
                const cabinPos = airplane.position.clone().add(new THREE.Vector3(0, 2.3, 0.2).applyQuaternion(airplane.quaternion));
                camera.position.copy(cabinPos);
                camera.lookAt(airplane.position.clone().add(new THREE.Vector3(0, 2.0, -20).applyQuaternion(airplane.quaternion)));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            updatePhysics(delta);
            updateCamera();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
