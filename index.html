<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simulador Air Tractor - Versión Móvil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .hud-value {
            color: #FFD700;
            font-weight: bold;
        }
        
        #controls-info {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 11px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        
        .warning {
            color: #ff4444;
            font-weight: bold;
            animation: blink 0.5s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* Controles táctiles */
        #touch-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            z-index: 20;
            pointer-events: none;
        }
        
        .control-btn {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            backdrop-filter: blur(5px);
            transition: all 0.1s;
        }
        
        .control-btn:active {
            background: rgba(255,255,255,0.6);
            transform: scale(0.9);
        }
        
        #btn-up {
            left: 50%;
            transform: translateX(-50%);
            bottom: 60px;
        }
        
        #btn-down {
            left: 50%;
            transform: translateX(-50%);
            bottom: 0;
        }
        
        #btn-left {
            left: calc(50% - 60px);
            bottom: 30px;
        }
        
        #btn-right {
            left: calc(50% + 60px);
            bottom: 30px;
        }
        
        #btn-throttle {
            right: 20px;
            bottom: 60px;
            background: rgba(255,100,100,0.4);
            border-color: rgba(255,100,100,0.7);
            font-size: 20px;
        }
        
        #btn-brake {
            right: 20px;
            bottom: 0;
            background: rgba(100,100,255,0.4);
            border-color: rgba(100,100,255,0.7);
            font-size: 20px;
        }
        
        #btn-takeoff {
            left: 20px;
            bottom: 60px;
            background: rgba(100,255,100,0.4);
            border-color: rgba(100,255,100,0.7);
            font-size: 14px;
            font-weight: bold;
        }
        
        #btn-land {
            left: 20px;
            bottom: 0;
            background: rgba(255,255,100,0.4);
            border-color: rgba(255,255,100,0.7);
            font-size: 14px;
            font-weight: bold;
        }
        
        #btn-reset {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,0,0,0.5);
            border: 2px solid rgba(255,0,0,0.7);
            color: white;
            font-size: 20px;
            pointer-events: auto;
            z-index: 30;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div>🚀 Velocidad: <span class="hud-value" id="speed">0</span> km/h</div>
        <div>📏 Altitud: <span class="hud-value" id="altitude">0</span> m</div>
        <div>✈️ Estado: <span class="hud-value" id="state">En tierra</span></div>
        <div id="warning" style="display:none;" class="warning">⚠️ ¡PELIGRO! ¡Demasiado bajo!</div>
    </div>
    
    <div id="controls-info">
        Usa los botones táctiles para volar
    </div>
    
    <button id="btn-reset" ontouchstart="resetPlane()">↺</button>
    
    <div id="touch-controls">
        <div class="control-btn" id="btn-up" ontouchstart="setControl('up', true)" ontouchend="setControl('up', false)">▲</div>
        <div class="control-btn" id="btn-down" ontouchstart="setControl('down', true)" ontouchend="setControl('down', false)">▼</div>
        <div class="control-btn" id="btn-left" ontouchstart="setControl('left', true)" ontouchend="setControl('left', false)">◀</div>
        <div class="control-btn" id="btn-right" ontouchstart="setControl('right', true)" ontouchend="setControl('right', false)">▶</div>
        <div class="control-btn" id="btn-throttle" ontouchstart="setControl('throttle', true)" ontouchend="setControl('throttle', false)">⚡</div>
        <div class="control-btn" id="btn-brake" ontouchstart="setControl('brake', true)" ontouchend="setControl('brake', false)">🛑</div>
        <div class="control-btn" id="btn-takeoff" ontouchstart="takeoff()">🛫</div>
        <div class="control-btn" id="btn-land" ontouchstart="land()">🛬</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Ajustar canvas al tamaño de la ventana
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        
        // Variables del juego
        let gameTime = 0;
        let cameraX = 0;
        let cameraY = 0;
        
        // Estado del avión
        const plane = {
            x: 0,
            y: 0,
            z: 0,
            speed: 0,
            pitch: 0,
            roll: 0,
            yaw: 0,
            throttle: 0,
            flying: false,
            onGround: true
        };
        
        // Controles táctiles
        const touchControls = {
            up: false,
            down: false,
            left: false,
            right: false,
            throttle: false,
            brake: false
        };
        
        function setControl(control, value) {
            touchControls[control] = value;
        }
        
        // Campos agrícolas
        const fields = [];
        const fieldColors = ['#8B7355', '#A0522D', '#CD853F', '#D2691E', '#8B4513', '#DAA520'];
        
        function generateFields() {
            for (let i = 0; i < 60; i++) {
                const x = (Math.random() - 0.5) * 4000;
                const y = (Math.random() - 0.5) * 4000;
                const width = 40 + Math.random() * 120;
                const height = 40 + Math.random() * 120;
                const color = fieldColors[Math.floor(Math.random() * fieldColors.length)];
                
                fields.push({
                    x, y, width, height, color,
                    planted: true
                });
            }
        }
        
        // Árboles
        const trees = [];
        function generateTrees() {
            for (let i = 0; i < 150; i++) {
                trees.push({
                    x: (Math.random() - 0.5) * 4500,
                    y: (Math.random() - 0.5) * 4500,
                    size: 2 + Math.random() * 4
                });
            }
        }
        
        // Pistas de aterrizaje
        const runways = [
            { x: 0, y: 0, length: 700, width: 35, direction: 0 },
            { x: 1000, y: 600, length: 600, width: 30, direction: Math.PI / 4 },
            { x: -800, y: -500, length: 650, width: 32, direction: -Math.PI / 6 },
            { x: 500, y: -800, length: 550, width: 28, direction: Math.PI / 3 }
        ];
        
        // Inicializar
        generateFields();
        generateTrees();
        
        function takeoff() {
            if (plane.onGround && plane.speed > 40) {
                plane.flying = true;
                plane.onGround = false;
                plane.z = 1;
                plane.pitch = 0.15;
            }
        }
        
        function land() {
            if (plane.flying && plane.z < 5) {
                plane.flying = false;
                plane.onGround = true;
                plane.z = 0;
                plane.pitch = 0;
                plane.roll = 0;
            }
        }
        
        function resetPlane() {
            plane.x = 0;
            plane.y = 0;
            plane.z = 0;
            plane.speed = 0;
            plane.pitch = 0;
            plane.roll = 0;
            plane.yaw = 0;
            plane.throttle = 0;
            plane.flying = false;
            plane.onGround = true;
        }
        
        function update() {
            gameTime += 0.016;
            
            // Controles táctiles
            if (touchControls.throttle) plane.throttle = Math.min(1, plane.throttle + 0.015);
            if (touchControls.brake) plane.throttle = Math.max(0, plane.throttle - 0.03);
            
            if (touchControls.up) plane.pitch = Math.min(0.5, plane.pitch + 0.02);
            if (touchControls.down) plane.pitch = Math.max(-0.3, plane.pitch - 0.02);
            
            if (touchControls.left) plane.roll = Math.max(-0.5, plane.roll - 0.02);
            if (touchControls.right) plane.roll = Math.min(0.5, plane.roll + 0.02);
            
            // Auto-centrar controles
            if (!touchControls.left && !touchControls.right) {
                plane.roll *= 0.95;
            }
            if (!touchControls.up && !touchControls.down) {
                plane.pitch *= 0.95;
            }
            
            // Física de vuelo
            if (plane.flying || plane.speed > 0) {
                const acceleration = plane.throttle * 8;
                const drag = plane.speed * 0.015;
                
                plane.speed += (acceleration - drag) * 0.016;
                plane.speed = Math.max(0, Math.min(180, plane.speed));
                
                const radYaw = plane.yaw;
                
                if (plane.flying) {
                    // Movimiento 3D
                    plane.x += Math.cos(radYaw) * Math.cos(plane.roll) * plane.speed * 0.08;
                    plane.y += Math.sin(radYaw) * Math.cos(plane.roll) * plane.speed * 0.08;
                    plane.z += Math.sin(plane.pitch) * plane.speed * 0.04;
                    
                    // Gravedad
                    if (plane.speed < 40) {
                        plane.z = Math.max(0, plane.z - 0.15);
                        if (plane.z <= 0) {
                            plane.z = 0;
                            plane.flying = false;
                            plane.onGround = true;
                            plane.pitch = 0;
                        }
                    }
                } else {
                    // Movimiento en tierra
                    plane.x += Math.cos(radYaw) * plane.speed * 0.08;
                    plane.y += Math.sin(radYaw) * plane.speed * 0.08;
                    plane.speed *= 0.97;
                }
                
                // Yaw control
                if (plane.flying && Math.abs(plane.roll) > 0.1) {
                    plane.yaw += plane.roll * 0.015;
                }
            }
            
            // Límites de altitud
            plane.z = Math.max(0, Math.min(250, plane.z));
            
            // Cámara sigue al avión
            cameraX = plane.x;
            cameraY = plane.y;
            
            // Actualizar HUD
            document.getElementById('speed').textContent = Math.round(plane.speed * 3.6);
            document.getElementById('altitude').textContent = Math.round(plane.z);
            document.getElementById('state').textContent = plane.flying ? 'Volando ✈️' : 'En tierra 🚜';
            
            // Advertencia de baja altitud
            if (plane.flying && plane.z < 5 && plane.speed > 40) {
                document.getElementById('warning').style.display = 'block';
            } else {
                document.getElementById('warning').style.display = 'none';
            }
        }
        
        function draw() {
            // Limpiar canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Fondo de cielo
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(0.7, '#B0E0E6');
            skyGradient.addColorStop(1, '#F0E6D3');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Transformación de cámara
            ctx.save();
            const zoom = Math.max(0.6, 1.2 - plane.z * 0.002);
            ctx.translate(canvas.width / 2 - cameraX * zoom, canvas.height / 2 - cameraY * zoom);
            ctx.scale(zoom, zoom);
            
            // Dibujar suelo
            drawGround();
            
            // Dibujar campos
            drawFields();
            
            // Dibujar árboles
            drawTrees();
            
            // Dibujar pistas
            drawRunways();
            
            // Dibujar avión
            drawPlane();
            
            ctx.restore();
        }
        
        function drawGround() {
            ctx.fillStyle = '#90B77D';
            ctx.fillRect(-2500, -2500, 5000, 5000);
            
            // Textura de hierba
            for (let i = 0; i < 300; i++) {
                const x = ((i * 137) % 5000) - 2500;
                const y = ((i * 251) % 5000) - 2500;
                ctx.fillStyle = '#7FA06D';
                ctx.fillRect(x, y, 2, 2);
            }
        }
        
        function drawFields() {
            fields.forEach(field => {
                ctx.fillStyle = field.color;
                ctx.fillRect(field.x, field.y, field.width, field.height);
                
                // Líneas de cultivo
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 1;
                for (let i = 0; i < field.width; i += 8) {
                    ctx.beginPath();
                    ctx.moveTo(field.x + i, field.y);
                    ctx.lineTo(field.x + i, field.y + field.height);
                    ctx.stroke();
                }
            });
        }
        
        function drawTrees() {
            trees.forEach(tree => {
                ctx.fillStyle = '#654321';
                ctx.fillRect(tree.x - 1, tree.y - 1, 2, 3);
                ctx.fillStyle = '#2E8B57';
                ctx.beginPath();
                ctx.arc(tree.x, tree.y - 2, tree.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function drawRunways() {
            runways.forEach(runway => {
                ctx.save();
                ctx.translate(runway.x, runway.y);
                ctx.rotate(runway.direction);
                
                ctx.fillStyle = '#808080';
                ctx.fillRect(-runway.length/2, -runway.width/2, runway.length, runway.width);
                
                // Líneas de la pista
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.setLineDash([15, 15]);
                ctx.beginPath();
                ctx.moveTo(-runway.length/2, 0);
                ctx.lineTo(runway.length/2, 0);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.restore();
            });
        }
        
        function drawPlane() {
            ctx.save();
            ctx.translate(plane.x, plane.y);
            ctx.rotate(plane.yaw);
            
            // Sombra en tierra
            if (plane.flying) {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, -plane.z, 18, 6, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Cuerpo del avión
            ctx.fillStyle = '#DC143C';
            ctx.fillRect(-12, -2, 24, 4);
            
            // Nariz
            ctx.fillStyle = '#B22222';
            ctx.beginPath();
            ctx.arc(12, 0, 2, -Math.PI/2, Math.PI/2);
            ctx.fill();
            
            // Cabina
            ctx.fillStyle = '#4169E1';
            ctx.beginPath();
            ctx.arc(0, -1, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Alas
            ctx.fillStyle = '#B22222';
            ctx.fillRect(-8, -6, 16, 9);
            
            // Motor
            ctx.fillStyle = '#333';
            ctx.fillRect(9, -1, 3, 2);
            
            // Hélice
            if (plane.throttle > 0) {
                ctx.fillStyle = '#555';
                ctx.beginPath();
                ctx.ellipse(13, 0, 1.5, 4, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Cola
            ctx.fillStyle = '#B22222';
            ctx.fillRect(-16, -4, 6, 8);
            
            // Ruedas
            ctx.fillStyle = '#333';
            ctx.fillRect(-6, 2, 3, 1.5);
            ctx.fillRect(4, 2, 3, 1.5);
            
            ctx.restore();
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Manejar resize
        window.addEventListener('resize', resizeCanvas);
        
        // Prevenir scroll en móvil
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        // Iniciar juego
        gameLoop();
    </script>
</body>
</html>
